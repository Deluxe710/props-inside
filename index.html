/* ================= CREATIVE MULTIPLAYER SYNC =================
   The host owns the map. A joining player first gets a full snapshot (gzip, split into small chunks), then a stream of small
   numbered change messages. Changes that arrive while a snapshot is still loading are queued and applied on top of it, so late
   joiners can never miss or double-apply an edit. */
const CHUNK=12000;
function crNetNew(){return{track:false,touched:new Set(),dels:[],clr:false,ver:0,rev:0,sid:0,acc:0,snap:null,rx:null,state:'solo',queue:[],snapRev:-1,gen:0,tries:0};}
/* host: send what changed since the last flush (about 10 times a second while editing) */
function crNetFlush(){
  const N=CR.net;if(!N.track)return;
  if(!G.conns.size){N.touched.clear();N.dels.length=0;N.clr=false;TR.net.clear();return;}
  if(TR.net.size){const arr=[...TR.net].map(ci=>[ci,trChunkInts(ci)]);TR.net.clear();for(let i=0;i<arr.length;i+=6)bc({t:'terr',rs:0,c:arr.slice(i,i+6)});}
  if(!N.touched.size&&!N.dels.length&&!N.clr)return;
  const msgs=[];let cur={t:'mop',rev:0,c:N.clr?1:0,d:[],r:[]},sz=0;
  const push=()=>{cur.rev=++N.rev;msgs.push(cur);cur={t:'mop',rev:0,c:0,d:[],r:[]};sz=0;};
  for(const id of N.dels){cur.d.push(id);sz+=8;if(sz>CHUNK-1500)push();}
  const list=[];for(const o of N.touched)if(!o.dead&&CR.byId.get(o.id)===o)list.push(o);
  list.sort((a,b)=>(a.type==='window'?1:0)-(b.type==='window'?1:0));
  for(const o of list){
    const r=crRecord(o),s=JSON.stringify(r);
    if(s===o.ls)continue;
    o.ls=s;cur.r.push(r);sz+=s.length+1;if(sz>CHUNK-1500)push();
  }
  if(cur.c||cur.d.length||cur.r.length)push();
  N.touched.clear();N.dels.length=0;N.clr=false;
  for(const m of msgs)bc(m);
}
function crSnapBuild(){
  const N=CR.net;
  if(N.snap&&N.snap.ver===N.ver)return N.snap.p;
  const recs=crSerialize(),json=JSON.stringify(recs),rev=N.rev,sid=++N.sid,nm=CR.mapName,sp=CR.spawn||[0,0,6,0];
  const p=(async()=>{
    const pk=await crPack(json),parts=[];
    for(let i=0;i<pk.d.length;i+=CHUNK)parts.push(pk.d.slice(i,i+CHUNK));
    if(!parts.length)parts.push('');
    return{head:{t:'mapb',sid,rev,n:recs.length,nm,z:pk.z,np:parts.length,len:pk.d.length,h:fnv(json),sp},parts};
  })();
  N.snap={ver:N.ver,p};return p;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function crSendSnap(conn){
  try{
    while(CR.busy)await sleep(60);
    const s=await crSnapBuild();
    if(!conn||!conn.open)return;
    conn.send(s.head);
    for(let i=0;i<s.parts.length;i++){
      if(!conn.open)return;
      while(conn.dataChannel&&conn.dataChannel.bufferedAmount>384*1024)await sleep(25);
      conn.send({t:'mapc',sid:s.head.sid,i,d:s.parts[i]});
      if(i%5===4)await sleep(8);
    }
    if(conn.open){const tl=trSerialize();if(!tl.length)conn.send({t:'terr',rs:1,c:[]});for(let i=0;i<tl.length&&conn.open;i+=6){conn.send({t:'terr',rs:i===0?1:0,c:tl.slice(i,i+6)});await sleep(8);}}
  }catch(e){}
}
function crNetResync(){for(const c of G.conns.values())crSendSnap(c);}

/* client side */
function crNetHead(m){
  const N=CR.net;
  CR.loadTok++;N.gen++;N.state='loading';CR.busy=true;
  crClear();
  N.rx={sid:m.sid,rev:m.rev|0,np:clamp(m.np|0,1,5000),parts:[],got:0,z:m.z?1:0,len:m.len|0,h:String(m.h||''),nm:m.nm,sp:m.sp};
  crProg('RECEIVING MAP',0);
}
function crNetChunk(m){
  const N=CR.net,rx=N.rx;if(!rx||m.sid!==rx.sid)return;
  const i=m.i|0;if(i<0||i>=rx.np||typeof m.d!=='string')return;
  if(rx.parts[i]===undefined){rx.parts[i]=m.d;rx.got++;}
  crProg('RECEIVING MAP',rx.got/rx.np*.6);
  if(rx.got===rx.np){N.rx=null;crNetAssemble(rx);}
}
async function crNetAssemble(rx){
  const N=CR.net,gen=N.gen;
  try{
    const data=rx.parts.join('');
    if(data.length!==rx.len)throw new Error('length');
    const json=await crUnpack(rx.z,data);
    if(gen!==N.gen||!CR.live)return;
    if(fnv(json)!==rx.h)throw new Error('checksum');
    const cl=crCleanAll(JSON.parse(json),6000);
    if(cl.bad)throw new Error('format');
    if(typeof rx.nm==='string')CR.mapName=crMapName(rx.nm);
    if(Array.isArray(rx.sp)&&rx.sp.length>=4)CR.spawn=[cnum(rx.sp[0],-1000,1000,0),cnum(rx.sp[1],0,200,0),cnum(rx.sp[2],-1000,1000,6),cnum(rx.sp[3],-100,100,0)];
    const first=!N.loadedOnce;
    crLoadRecords(cl.recs,{label:'BUILDING MAP',spawn:first,onDone:()=>{
      if(gen!==N.gen)return;
      N.loadedOnce=true;N.snapRev=rx.rev;N.tries=0;N.state='ready';
      const q=N.queue;N.queue=[];for(const op of q)if(op.rev>N.snapRev)crApplyOp(op);
      crProgHide();toast('Map ready: '+CR.objs.length+' objects');
      sendHost({t:'mapok',n:CR.objs.length});crRefresh();
    }});
  }catch(e){
    if(gen!==N.gen)return;
    N.tries++;
    if(N.tries<=3){crProg('MAP TRANSFER FAILED, RETRYING',-1);sendHost({t:'mapr'});}
    else leaveToMenu('Could not receive the map from the host. Try joining again.');
  }
}
function crApplyOp(m){
  const N=CR.net;N.snapRev=Math.max(N.snapRev,m.rev|0);
  if(m.c)crClear();
  if(Array.isArray(m.d))for(const id of m.d){const o=CR.byId.get(id|0);if(o)crRemove(o);}
  if(Array.isArray(m.r)){
    for(const r0 of m.r){const r=crCleanRecord(r0);if(!r||!(r.i>0))continue;try{crUpsert(r);}catch(e){}}
  }
}
function crNetOp(m){
  if(!CRE()||!CR.ro)return;
  const N=CR.net;
  if(N.state!=='ready'){if(N.queue.length<4000)N.queue.push(m);return;}
  if((m.rev|0)>N.snapRev)crApplyOp(m);

function crPropDef(){return PROPD[CR.propKind]||PROPD.bush_s;}
function crPropSize(){const d=crPropDef(),k=CR.propScale;return new V3(d.dims[0]*k,d.dims[1]*k,d.dims[2]*k);}
function crPropPlaceCalc(ray){

/* ---- picking & ray math ---- */
function crRay(){
  if(sideOpen()){
    const d=new V3(G.mx/innerWidth*2-1,-(G.my/innerHeight)*2+1,.5).unproject(cam).sub(cam.position).normalize();
    return{o:cam.position.clone(),d};
  }
  return{o:cam.position.clone(),d:new V3(0,0,-1).applyQuaternion(cam.quaternion)};
}
function crRayObj(o,ray){
  const bb=o.bb,m=.07;
  if(rayBox(ray.o.x,ray.o.y,ray.o.z,ray.d.x,ray.d.y,ray.d.z,bb.min[0]-m,bb.min[1]-m,bb.min[2]-m,bb.max[0]+m,bb.max[1]+m,bb.max[2]+m)<0)return null;
  const q=_cq.copy(o.quat).invert();
  const lo=_cv1.copy(ray.o).sub(o.pos).applyQuaternion(q),ld=_cv2.copy(ray.d).applyQuaternion(q);
  const l=[lo.x,lo.y,lo.z],d=[ld.x,ld.y,ld.z];
  let list;
  if(o.type==='rect')list=o.pieces;
  else if(o.type==='prop'){const hz=o.size;list=[[-hz.x/2,-hz.y/2,-hz.z/2,hz.x/2,hz.y/2,hz.z/2]];}
  else{const hz=o.type==='window'?.05:.06;list=[[-o.size.x/2,-o.size.y/2,-hz,o.size.x/2,o.size.y/2,hz]];}
  let best=-1,bax=-1,bsg=0;
  for(const P of list){
    let tn=-1e9,tf=1e9,ax=-1,sg=0,ok=true;
    for(let i=0;i<3;i++){
      if(Math.abs(d[i])<1e-9){if(l[i]<P[i]||l[i]>P[3+i]){ok=false;break;}continue;}
      let t1=(P[i]-l[i])/d[i],t2=(P[3+i]-l[i])/d[i],s=-1;
      if(t1>t2){const t=t1;t1=t2;t2=t;s=1;}
      if(t1>tn){tn=t1;ax=i;sg=s;}
      if(t2<tf)tf=t2;
      if(tn>tf){ok=false;break;}
    }
    if(ok&&tn>=0&&ax>=0&&(best<0||tn<best)){best=tn;bax=ax;bsg=sg;}
  }
  if(best<0)return null;
  const n=new V3();n.setComponent(bax,bsg).applyQuaternion(o.quat);
  return{t:best,n};
}
function crPick(ray,ign){
  let best=null;
  if(ray.d.y<-1e-6){const t=-ray.o.y/ray.d.y;if(t>0&&t<300)best={t,obj:null,n:new V3(0,1,0)};}
  if(TR.any){const th=trRay(ray,300,false);if(th&&(!best||th.t<best.t))best={t:th.t,obj:null,n:th.n};}
  for(const o of CR.objs){if(o===ign)continue;const h=crRayObj(o,ray);if(h&&(!best||h.t<best.t))best={t:h.t,obj:o,n:h.n};}
  if(best)best.point=ray.o.clone().addScaledVector(ray.d,best.t);
  return best;
}
function crLineParam(ray,P0,A){
  const w=_cv1.copy(ray.o).sub(P0),b=ray.d.dot(A),d=ray.d.dot(w),e=A.dot(w),den=1-b*b;
  if(den<1e-3)return null;

}
function crPlane(ray,P0,N){
  const den=N.dot(ray.d);if(Math.abs(den)<1e-4)return null;
  const t=N.dot(_cv1.copy(P0).sub(ray.o))/den;if(t<0||t>400)return null;

}
function crAng(hit,c,k){
  const v=hit.clone().sub(c);
  return k===0?Math.atan2(v.z,v.y):k===1?Math.atan2(v.x,v.z):Math.atan2(v.y,v.x);

/* ---- snapping: grid lines + faces of nearby objects ---- */
function crSnapAxis(k,c,h,pos,e,ign){
  const g=gridSize(),lo=c-h,hi=c+h,thr=Math.max(.12,Math.min(.4,g*.6));
  let bd=thr,best=null;
  for(const o of CR.objs){
    if(o===ign||o.type==='window')continue;
    let near=true;
    for(let j=0;j<3;j++){if(j===k)continue;const pj=pos.getComponent(j);if(o.bb.min[j]>pj+e[j]+1||o.bb.max[j]<pj-e[j]-1){near=false;break;}}
    if(!near)continue;
    for(const t of[o.bb.min[k],o.bb.max[k]])for(const f of[lo,hi]){const d=t-f;if(Math.abs(d)<=bd){bd=Math.abs(d);best=d;}}
  }
  if(best!==null)return c+best;
  let bg=1e9,bgd=0;
  for(const f of[lo,hi]){const d=Math.round(f/g)*g-f;if(Math.abs(d)<bg){bg=Math.abs(d);bgd=d;}}
  return c+bgd;
}
function crSnap(pos,e,skip,ign){
  if(!CR.snap)return;
  for(let k=0;k<3;k++){if(skip&&skip[k])continue;pos.setComponent(k,crSnapAxis(k,pos.getComponent(k),e[k],pos,e,ign));}
}
function crSnapFace(k,f,ign){
  const g=gridSize(),thr=Math.max(.12,Math.min(.4,g*.6));let bd=thr,best=null;
  for(const o of CR.objs){
    if(o===ign||o.type==='window')continue;
    let near=true;
    for(let j=0;j<3;j++){if(j===k)continue;if(o.bb.min[j]>ign.bb.max[j]+1||o.bb.max[j]<ign.bb.min[j]-1){near=false;break;}}
    if(!near)continue;
    for(const t of[o.bb.min[k],o.bb.max[k]]){const d=Math.abs(t-f);if(d<=bd){bd=d;best=t;}}
  }
  return best!==null?best:Math.round(f/g)*g;
}

/* ---- gizmo ---- */
function crBuildGizmo(){
  const g=new THREE.Group();g.visible=false;
  const gz={g,sh:[],cn:[],rg:[],cb:[]};
  const bx=new THREE.BoxGeometry(1,1,1),cone=new THREE.ConeGeometry(.5,1,10),tor=new THREE.TorusGeometry(1,.035,6,56);
  const mk=(geo,c)=>{const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:c,depthTest:false,transparent:true,fog:false}));m.userData.c=c;m.renderOrder=1000;m.visible=false;g.add(m);return m;};
  for(let k=0;k<3;k++){gz.sh.push(mk(bx,AXC[k]));gz.cn.push(mk(cone,AXC[k]));gz.rg.push(mk(tor,AXC[k]));}
  for(let i=0;i<6;i++)gz.cb.push(mk(bx,AXC[i>>1]));
  return gz;
}
const crGS=o=>clamp(cam.position.distanceTo(o.pos)*.16,.5,18);
const ZV=new V3(0,0,1);
function crUpdateGizmo(){
  const o=CR.sel,gz=CR.gz;
  if(!o||CR.tool!=='select'){gz.g.visible=false;return;}
  gz.g.visible=true;
  const gs=crGS(o),mode=CR.mode,hh=CR.drag?CR.drag.h:CR.hh,win=o.type==='window';
  const on=(kind,axis,sign)=>!!hh&&hh.kind===kind&&hh.axis===axis&&(kind!=='scl'||hh.sign===sign);
  const hl=(m,v)=>m.material.color.setHex(v?0xfff06a:m.userData.c);
  for(let k=0;k<3;k++){
    const mv=mode==='move'&&crMovable(o,k),sh=gz.sh[k],cn=gz.cn[k],rg=gz.rg[k];
    sh.visible=cn.visible=mv;rg.visible=mode==='rotate'&&!win;
    if(mv){
      const dir=crAxisDir(o,k),L=o.e[k]+gs*.9,th=gs*.05;
      sh.position.copy(o.pos).addScaledVector(dir,L/2);sh.quaternion.setFromUnitVectors(ZV,dir);sh.scale.set(th,th,L);
      cn.position.copy(o.pos).addScaledVector(dir,L+gs*.2);cn.quaternion.setFromUnitVectors(UPV,dir);cn.scale.set(gs*.3,gs*.4,gs*.3);
      const a=on('move',k);hl(sh,a);hl(cn,a);
    }
    if(rg.visible){
      rg.position.copy(o.pos);rg.scale.setScalar(gs*1.4);rg.rotation.set(k===1?Math.PI/2:0,k===0?Math.PI/2:0,0);hl(rg,on('rot',k));
    }
  }
  for(let i=0;i<6;i++){
    const ax=i>>1,sg=(i&1)?-1:1,m=gz.cb[i];
    m.visible=mode==='scale'&&crScalable(o,ax);
    if(m.visible){
      m.position.copy(o.pos).addScaledVector(crLA(o,ax),sg*o.size.getComponent(ax)/2);
      m.quaternion.copy(o.quat);m.scale.setScalar(gs*.22);hl(m,on('scl',ax,sg));
    }
  }
}
function crPickHandle(ray){
  const o=CR.sel;if(!o||CR.tool!=='select')return null;
  const gs=crGS(o);let best=null;
  const cand=(h,t)=>{if(!best||t<best.t){h.t=t;best=h;}};
  if(CR.mode==='move'){
    for(let k=0;k<3;k++){
      if(!crMovable(o,k))continue;
      const A=crAxisDir(o,k),w=ray.o.clone().sub(o.pos),b=ray.d.dot(A),d=ray.d.dot(w),e=A.dot(w),den=1-b*b;
      let s=den>1e-4?(e-b*d)/den:0;s=clamp(s,0,o.e[k]+gs*1.3);
      const t=-d+s*b;if(t<=0)continue;
      const q=o.pos.clone().addScaledVector(A,s),p=ray.o.clone().addScaledVector(ray.d,t);
      if(p.distanceTo(q)<gs*.14)cand({kind:'move',axis:k},t);
    }
  }else if(CR.mode==='rotate'){
    if(o.type==='window')return null;
    for(let k=0;k<3;k++){
      const hit=crPlane(ray,o.pos,AX[k]);if(!hit)continue;
      if(Math.abs(hit.distanceTo(o.pos)-gs*1.4)<gs*.14)cand({kind:'rot',axis:k},hit.distanceTo(ray.o));

    for(let i=0;i<6;i++){

      if(t<=0)continue;

    }
  }
  return best;
}

function crPlaceCalc(ray){
  const isT=CR.tool==='text',h=crPick(ray,null);
  const p=h?h.point.clone():ray.o.clone().addScaledVector(ray.d,8),n=h?h.n.clone():new V3(0,1,0);
  const skip=[Math.abs(n.x)>.9,Math.abs(n.y)>.9,Math.abs(n.z)>.9];
  if(isT){
    const z=n.clone();let y;
    if(Math.abs(z.y)>.9){y=new V3(-Math.sin(me.yaw),0,-Math.cos(me.yaw));}else y=new V3(0,1,0);
    const x=new V3().crossVectors(y,z).normalize();y.crossVectors(z,x).normalize();
    const q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z));
    const t={pos:p.clone().addScaledVector(n,.03),size:new V3(CR.textDef.w,CR.textDef.h,.04),quat:q};
    crBB(t);crSnap(t.pos,t.e,skip,null);
    return t;
  }
  const size=CR.rectSize.clone(),hf=[size.x/2,size.y/2,size.z/2];
  const pos=p.clone().addScaledVector(n,Math.abs(n.x)*hf[0]+Math.abs(n.y)*hf[1]+Math.abs(n.z)*hf[2]);
  crSnap(pos,hf,skip,null);
  return{pos,size,quat:new THREE.Quaternion()};
}
function crPlace(pl){
  let o;
  if(CR.tool==='rect')o=crNew('rect',{pos:pl.pos,size:pl.size,quat:pl.quat,color:CR.brush.color,mat:CR.brush.mat});
  else if(CR.tool==='window'){
    o=crNew('window',{host:pl.host,a:pl.a,cu:pl.cu,cv:pl.cv,size:new V3(pl.w,pl.h,WTHICK),tint:CR.winDef.tint,op:CR.winDef.op});
  }else if(CR.tool==='prop'){
    o=crNew('prop',{pos:pl.pos,size:pl.size,quat:pl.quat,color:crPropColorNow(),kind:CR.propKind,collide:!crPropDef().nc});
    crSelect(o);crDirty();sfx('equip');
    if(o.lock)toast(PROPD[o.kind].n+' placed. Furniture is permanent in normal mode.');
    return;
  }else o=crNew('text',{pos:pl.pos,size:pl.size,quat:pl.quat,color:0,txt:{str:CR.textDef.str,color:CR.textDef.color}});
  crSelect(o);crSetTool('select');crDirty();sfx('equip');
  if(o.type==='text')crOpenEdit();
}
function crUpdateGhost(ray,act){
  const t=CR.tool;
  CR.ghR.visible=false;CR.ghT.mesh.visible=false;CR.ghW.visible=false;CR.ghP.visible=false;
  if(!(t==='text'||t==='rect'||t==='window'||t==='prop')||!act)return null;
  const pl=t==='window'?crWindowCalc(ray):t==='prop'?crPropPlaceCalc(ray):crPlaceCalc(ray);
  if(!pl)return null;
  if(t==='rect'){CR.ghR.visible=true;CR.ghR.position.copy(pl.pos);CR.ghR.quaternion.copy(pl.quat);CR.ghR.scale.copy(pl.size);}
  else if(t==='prop'){
    const g=CR.ghP;
    if(CR.ghKind!==CR.propKind){CR.ghKind=CR.propKind;g.geometry=crPropModel(CR.propKind).geo;}
    g.visible=true;g.position.copy(pl.pos);g.quaternion.copy(pl.quat);g.scale.copy(pl.size);
  }
  else if(t==='window'){CR.ghW.visible=true;CR.ghW.position.copy(pl.pos);CR.ghW.quaternion.copy(pl.quat);CR.ghW.scale.set(pl.w,pl.h,.1);}
  else{
    const g=CR.ghT,key=CR.textDef.str+'|'+CR.textDef.color+'|'+CR.textDef.w+'|'+CR.textDef.h;
    if(key!==CR.ghKey){CR.ghKey=key;g.size.set(CR.textDef.w,CR.textDef.h,.04);g.txt.str=CR.textDef.str;g.txt.color=CR.textDef.color;crTextDraw(g);}
    g.mesh.visible=true;g.mesh.position.copy(pl.pos);g.mesh.quaternion.copy(pl.quat);g.mesh.scale.set(pl.size.x,pl.size.y,1);
  }
  return pl;
}

/* ---- dragging ---- */
function crDragStartHandle(h,ray){
  const o=CR.sel,d={kind:h.kind,axis:h.axis,sign:h.sign||1,o,sp:o.pos.clone(),ss:o.size.clone(),sq:o.quat.clone(),cu0:o.cu,cv0:o.cv,moved:false,h};
  if(h.kind==='move'){const s=crLineParam(ray,o.pos,crAxisDir(o,h.axis));if(s===null)return;d.g=s;}
  else if(h.kind==='rot'){const hit=crPlane(ray,o.pos,AX[h.axis]);if(!hit)return;d.a0=crAng(hit,o.pos,h.axis);}
  else{
    const a=crLA(o,h.axis).multiplyScalar(d.sign);d.a=a;d.s0=o.size.getComponent(h.axis);
    d.F=o.pos.clone().addScaledVector(a,-d.s0/2);
    const s=crLineParam(ray,d.F,a);if(s===null)return;d.g=s;
  }
  CR.drag=d;
}
function crDragStartBody(o,ray,p){
  CR.drag={kind:'body',o,sp:o.pos.clone(),ss:o.size.clone(),sq:o.quat.clone(),cu0:o.cu,cv0:o.cv,moved:false,h:null,p0:p.clone(),off:o.pos.clone().sub(p),vert:!!(keys.ShiftLeft||keys.ShiftRight)};
}
function crDragUpdate(ray){
  const d=CR.drag,o=d.o,win=o.type==='window';
  if(d.kind==='move'){
    const A=crAxisDir(o,d.axis),s=crLineParam(ray,d.sp,A);if(s===null)return;
    const ds=clamp(s-d.g,-400,400);if(!d.moved&&Math.abs(ds)<.04)return;d.moved=true;
    const np=d.sp.clone().addScaledVector(A,ds);
    if(win){crWinSetFromWorld(o,np,[d.axis===0,d.axis===1]);return;}
    const skip=[true,true,true];skip[d.axis]=false;crSnap(np,o.e,skip,o);
    o.pos.copy(np);crApply(o);
  }else if(d.kind==='body'){
    let hit;
    if(win)hit=crPlane(ray,d.p0,crLA(o,2));
    else hit=d.vert?crPlane(ray,d.p0,new V3(-Math.sin(me.yaw),0,-Math.cos(me.yaw))):crPlane(ray,d.p0,AX[1]);
    if(!hit)return;
    const np=win?hit.add(d.off):d.vert?new V3(d.sp.x,hit.y+d.off.y,d.sp.z):new V3(hit.x+d.off.x,d.sp.y,hit.z+d.off.z);
    if(!d.moved&&np.distanceTo(d.sp)<.05)return;d.moved=true;
    if(win){crWinSetFromWorld(o,np,[true,true]);return;}
    crSnap(np,o.e,d.vert?[true,false,true]:[false,true,false],o);
    o.pos.copy(np);crApply(o);
  }else if(d.kind==='rot'){
    const hit=crPlane(ray,d.sp,AX[d.axis]);if(!hit)return;
    let da=crAng(hit,d.sp,d.axis)-d.a0;da=Math.atan2(Math.sin(da),Math.cos(da));
    if(!d.moved&&Math.abs(da)<.03)return;d.moved=true;
    if(CR.snap){const st=Math.PI/12;da=Math.round(da/st)*st;}
    d.da=da;o.quat.setFromAxisAngle(AX[d.axis],da).multiply(d.sq).normalize();crApply(o);
  }else{
    const s=crLineParam(ray,d.F,d.a);if(s===null)return;
    let ns=d.s0+clamp(s-d.g,-400,400);if(!d.moved&&Math.abs(ns-d.s0)<.03)return;d.moved=true;
    if(win){
      /* resize in the wall's own space so edges snap to the wall edges and grid */
      const wa=WAX[o.a][0],ha=WAX[o.a][1],ax=d.axis?ha:wa,hs=o.host.size.getComponent(ax)/2,g=gridSize(),thr=Math.max(.12,Math.min(.4,g*.6));
      const c0=d.axis?d.cv0:d.cu0,fixedC=c0-d.sign*d.s0/2;
      let face=fixedC+d.sign*ns;
      if(CR.snap){
        const x=face+hs;let sx=Math.round(x/g)*g;
        if(Math.abs(x)<=thr)sx=0;else if(Math.abs(x-2*hs)<=thr)sx=2*hs;
        face=sx-hs;
      }
      face=clamp(face,-hs,hs);
      ns=Math.max(.1,d.sign*(face-fixedC));
      o.size.setComponent(d.axis,ns);
      if(d.axis)o.cv=fixedC+d.sign*ns/2;else o.cu=fixedC+d.sign*ns/2;
      crApply(o);return;
    }
    if(CR.snap){
      let k=-1;for(let j=0;j<3;j++)if(Math.abs(d.a.getComponent(j))>.9999)k=j;
      if(k>=0){const ak=d.a.getComponent(k),f0=d.F.getComponent(k);ns=(crSnapFace(k,f0+ak*ns,o)-f0)/ak;}
      else{const g=gridSize();ns=Math.round(ns/g)*g;}
    }
    ns=Math.max(.05,ns);
    o.size.setComponent(d.axis,ns);o.pos.copy(d.F).addScaledVector(d.a,ns/2);
    if(o.type==='text')crTextDraw(o);
    crApply(o);
  }
}
function crDragEnd(){
  const d=CR.drag;CR.drag=null;if(!d)return;
  if(d.moved){
    const o=d.o;
    if(o.type==='rect')CR.rectSize.copy(o.size);
    else if(o.type==='text'){CR.textDef.w=o.size.x;CR.textDef.h=o.size.y;}
    else if(o.type==='window'){CR.winDef.w=o.size.x;CR.winDef.h=o.size.y;}
    crDirty();
  }
  crRefresh();
}
function crDragCancel(){
  const d=CR.drag;CR.drag=null;if(!d)return;
  const o=d.o;o.pos.copy(d.sp);o.size.copy(d.ss);o.quat.copy(d.sq);o.cu=d.cu0;o.cv=d.cv0;
  if(o.type==='text')crTextDraw(o);
  crApply(o);crRefresh();
}

/* skip drawing what is too far away to be seen (the fog ends at 300) */
function crCullTick(dt){
  CR.cullT-=dt;if(CR.cullT>0)return;CR.cullT=.25;
  const c=cam.position;
  for(const o of CR.objs){
    const dx=c.x-o.pos.x,dy=c.y-o.pos.y,dz=c.z-o.pos.z,r=o.e?Math.max(o.e[0],o.e[1],o.e[2])*1.74:0;
    const vis=(!crHidKind(o.kind)||EDIT())&&(o===CR.sel||Math.sqrt(dx*dx+dy*dy+dz*dz)-r<320);
    if(o.mesh.visible!==vis)o.mesh.visible=vis;
  }
}
function updateCreative(dt){
  vm.visible=false;
  crCullTick(dt);
  if(TR.ring)TR.ring.visible=false;
  if(CR.busy||CR.ro){
    CR.ghR.visible=false;CR.ghT.mesh.visible=false;CR.ghW.visible=false;CR.ghP.visible=false;CR.gz.g.visible=false;CR.hh=null;CR.drag=null;
    if(CR.hov)crSetHover(null);
    return;
  }
  const free=sideOpen(),act=((G.locked&&!G.pane)||(free&&G.mc))&&me.alive,ray=crRay();
  const L=!!(mouse.l&&act),R=!!(mouse.r&&act);
  const pL=L&&!CR.prevL,rL=!L&&CR.prevL,pR=R&&!CR.prevR;CR.prevL=L;CR.prevR=R;
  if(pR&&!free){if(CR.drag)crDragCancel();else if(CR.tool!=='select')crSetTool('select');else crSelect(null);}
  if(!act&&CR.drag)crDragEnd();
  if(CR.tool==='select'){
    CR.ghR.visible=false;CR.ghT.mesh.visible=false;CR.ghW.visible=false;CR.ghP.visible=false;
    if(CR.drag){
      crDragUpdate(ray);if(rL)crDragEnd();
      CR.infoT+=dt;if(CR.infoT>.08){CR.infoT=0;crRefresh();}
    }else{
      const hh=act?crPickHandle(ray):null;CR.hh=hh;
      let p=null;if(act&&!hh)p=crPick(ray,null);
      crSetHover(p&&p.obj?p.obj:null);
      if(pL){
        if(hh)crDragStartHandle(hh,ray);
        else if(p&&p.obj){crSelect(p.obj);crDragStartBody(p.obj,ray,p.point);}
        else crSelect(null);
      }
    }
  }else if(CR.tool==='sculpt'){
    CR.ghR.visible=false;CR.ghT.mesh.visible=false;CR.ghW.visible=false;CR.ghP.visible=false;CR.hh=null;crSetHover(null);
    const hit=act?trRay(ray,300,true):null;
    if(hit){
      trRing(hit.point);
      if(L){
        if(pL)TR.flat=hit.point.y;
        trBrush(hit.point.x,hit.point.z,dt,TR.mode);TR.stroke=true;
      }
    }
    if(!L&&TR.stroke){TR.stroke=false;crDirty();}
  }else if(CR.tool==='paint'){
    CR.ghR.visible=false;CR.ghT.mesh.visible=false;CR.ghW.visible=false;CR.ghP.visible=false;CR.hh=null;
    const p=act?crPick(ray,null):null,t=p&&p.obj?p.obj:null;
    crSetHover(t);
    if(L&&t&&(pL||t!==CR.lastPaint)){crPaint(t,CR.brush.mat,CR.brush.color);CR.lastPaint=t;}
    if(!L)CR.lastPaint=null;
  }else{
    crSetHover(null);CR.hh=null;
    const pl=crUpdateGhost(ray,act);
    if(pL&&pl)crPlace(pl);
  }
  crUpdateGizmo();
  if(CR.saveT>0){CR.saveT-=dt;if(CR.saveT<=0&&!mouse.l)crSave();else if(CR.saveT<=0)CR.saveT=.2;}
  CR.net.acc+=dt;if(CR.net.acc>=.1){CR.net.acc=0;crNetFlush();}
}

const crHexC=c=>'#'+('000000'+c.toString(16)).slice(-6).toUpperCase();

/* ---- movement: walk, double-jump to fly ---- */
function creativeMove(dt,act){
  if(CR.busy)act=false;
  let ix=0,iz=0;
  if(act){if(keys.KeyW)iz+=1;if(keys.KeyS)iz-=1;if(keys.KeyD)ix+=1;if(keys.KeyA)ix-=1;}
  const len=Math.hypot(ix,iz)||1;ix/=len;iz/=len;
  const sprint=act&&(keys.ShiftLeft||keys.ShiftRight),sy=Math.sin(me.yaw),cy=Math.cos(me.yaw);
  me.crouch=lerp(me.crouch,0,Math.min(1,dt*12));me.nearCar=null;me.nearVeh=null;me.py0=me.pos.y;
  let ty=0;
  if(me.flying){
    const cp=Math.cos(me.pitch),sp=Math.sin(me.pitch),spd=sprint?26:12;
    let up=0;if(act){if(keys.Space)up+=1;if(keys.KeyC)up-=1;}
    const tx=(cy*ix+(-sy*cp)*iz)*spd,tz=(-sy*ix+(-cy*cp)*iz)*spd;ty=sp*iz*spd+up*spd*.75;
    const a=1-Math.exp(-dt*9);
    me.vel.x+=(tx-me.vel.x)*a;me.vel.y+=(ty-me.vel.y)*a;me.vel.z+=(tz-me.vel.z)*a;
  }else{
    const spd=sprint?8.6:5.6,wx=cy*ix-sy*iz,wz=-sy*ix-cy*iz,a=Math.min(1,(me.onGround?14:3)*dt);
    me.vel.x+=(wx*spd-me.vel.x)*a;me.vel.z+=(wz*spd-me.vel.z)*a;
    if(act&&keys.Space&&me.onGround){me.vel.y=9;me.onGround=false;me.jumps=1;sfx('jump');}
    me.vel.y=Math.max(-40,me.vel.y-26*dt);
  }
  me.onGround=false;
  const tox=me.pos.x,toz=me.pos.z;me.pos.x+=me.vel.x*dt;resolveHoriz('x');
  me.pos.z+=me.vel.z*dt;resolveHoriz('z');
  me.pos.y+=me.vel.y*dt;resolveVert();
  {const fl=trGround(tox,toz);if(me.pos.y<fl){me.pos.y=fl;if(me.vel.y<0)me.vel.y=0;me.onGround=true;}}
  me.pos.x=clamp(me.pos.x,-LIM,LIM);me.pos.z=clamp(me.pos.z,-LIM,LIM);
  if(me.onGround){me.jumps=0;if(me.flying&&ty<-.01){me.flying=false;showHint('Landed',1.2);}}
  else if(!me.flying&&me.jumps<1)me.jumps=1;

function creativeKey(e){
  const k=e.code;if(!(sideOpen()||(!G.pane&&G.locked)))return false;
  if(k==='Space'){
    if(!e.repeat){
      if(me.flying){if(G.time-(me.spaceT||0)<.3){me.flying=false;showHint('Flight off',1.2);}}
      else if(!me.onGround&&me.jumps>=1){me.flying=true;me.vel.y=Math.max(me.vel.y,0);showHint('FLYING · SPACE up · C down · SHIFT fast · double-tap SPACE to drop',3.5);}
      me.spaceT=G.time;
    }
    return false;
  }
  if(CR.ro||CR.busy)return /^(Digit[1-7]|Key[ZXVQGHKNFR]|Delete|Backspace|Enter)$/.test(k);
  if(/^Digit[1-7]$/.test(k)){const n=+k.slice(5),T=['select','rect','text','window','paint','prop','sculpt'];if(T[n-1])crSetTool(T[n-1]);return true;}
  if(k==='BracketLeft'||k==='BracketRight'){TR.r=clamp(TR.r+(k==='BracketRight'?1:-1),2,24);const sr=$('sRad');if(sr){sr.value=TR.r;$('sRadV').textContent=TR.r;}crRefresh();return true;}
  if(k==='KeyZ'){CR.mode='move';crRefresh();return true;}
  if(k==='KeyX'){CR.mode='rotate';crRefresh();return true;}
  if(k==='KeyV'){CR.mode='scale';crRefresh();return true;}
  if(k==='KeyQ'){CR.mode=CR.mode==='move'?'rotate':CR.mode==='rotate'?'scale':'move';crRefresh();return true;}
  if(k==='KeyG'){CR.snap=!CR.snap;crRefresh();return true;}
  if(k==='KeyH'){CR.gi=(CR.gi+1)%CR.grids.length;crRefresh();return true;}
  if(k==='KeyK'){crToggleCollide();return true;}
  if(k==='KeyN'){crDuplicate();return true;}
  if(k==='KeyR'){crTurnKey(e);return true;}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();crDelete();return true;}
  if(k==='KeyF'||k==='Enter'){if(CR.sel)crOpenEdit();return true;}
  return false;
}

function crDownload(text,name){

function pickMapFile(cb){

  const pk=await crPack(crMapText(name)),all=crSlots();
  all[name]={t:Date.now(),n:CR.objs.length,z:pk.z,d:pk.d};
  const keys=Object.keys(all).sort((a,b)=>all[b].t-all[a].t);
  for(const k of keys.slice(24))delete all[k];
  try{localStorage.setItem('pixelyard.creative.maps',JSON.stringify(all));return true;}catch(e){return false;}
}
async function crReadSlot(name){
  const e=crSlots()[name];if(!e||typeof e.d!=='string')return{ok:false,err:'That saved map is missing.'};
  try{return crParseMap(await crUnpack(e.z,e.d));}catch(x){return{ok:false,err:'That saved map is damaged.'};}
}
/* replace the whole world with a parsed map */
function crApplyMap(p){
  CR.spawn=p.spawn;CR.mapName=p.name;store.set('creative.name',p.name);trLoad(p.terrain||[]);
  crLoadRecords(p.recs,{spawn:true,label:'LOADING MAP',onDone:()=>{if(CR.autosave)crDirty();toast('Loaded "'+p.name+'": '+p.recs.length+' objects'+(p.skipped?' ('+p.skipped+' unreadable skipped)':''));}});
}
function renderCMaps(){
  const b=$('cmBody'),ro=CR.ro,slots=crSlots(),keys=Object.keys(slots).sort((a,c)=>slots[c].t-slots[a].t);
  const cn=crCounts(crSerialize());
  let h='<p class="small" id="cmMsg"></p><label class="field">MAP NAME<input id="cmName" maxlength="32" value="'+esc(CR.mapName)+'"'+(ro?' disabled':'')+'></label>';
  h+='<p class="small">'+CR.objs.length+' objects · '+cn.blocks+' blocks · '+cn.windows+' windows · '+cn.texts+' texts · '+(cn.props+cn.furniture)+' props</p>';
  if(!ro)h+='<button class="btn" id="cmSave">SAVE TO THIS DEVICE</button>';
  h+='<button class="btn primary" id="cmDl">DOWNLOAD MAP FILE</button>';
  if(!ro)h+='<button class="btn" id="cmLoad">LOAD MAP FROM FILE</button>';
  if(!ro&&keys.length){
    h+='<h3 class="ph">SAVED ON THIS DEVICE</h3>';
    for(const k of keys)h+='<div class="slotrow"><b>'+esc(k)+'</b><span>'+slots[k].n+' obj</span><button class="btn" data-a="load" data-n="'+esc(k)+'">LOAD</button><button class="btn" data-a="dl" data-n="'+esc(k)+'">FILE</button><button class="btn danger" data-a="del" data-n="'+esc(k)+'">X</button></div>';
  }
  h+='<button class="btn" id="cmBack">BACK</button>';
  b.innerHTML=h;
  const msg=(t,bad)=>{const e=$('cmMsg');if(e){e.textContent=t;e.style.color=bad?'var(--danger)':'var(--amber)';}};
  const nm=()=>crMapName($('cmName').value);
  $('cmBack').onclick=()=>showPane(CR.ro?'pause':'cprops');
  $('cmDl').onclick=()=>{const n=nm();if(!ro){CR.mapName=n;store.set('creative.name',n);}crDownload(crMapText(n),crFileName(n));msg('Downloaded '+crFileName(n));};
  if(ro)return;
  $('cmSave').onclick=async()=>{const ok=await crSaveSlot(nm());renderCMaps();const e=$('cmMsg');if(e){e.textContent=ok?'Saved to this device.':'Device storage is full. Use DOWNLOAD instead.';e.style.color=ok?'var(--amber)':'var(--danger)';}};
  $('cmLoad').onclick=()=>pickMapFile(p=>{
    if(!p.ok){msg(p.err,true);return;}
    if(CR.objs.length&&!confirm('Replace the current world with "'+p.name+'"? Unsaved changes are lost.'))return;
    crApplyMap(p);hidePanes();lock();
  });
  b.querySelectorAll('.slotrow .btn').forEach(x=>x.onclick=async()=>{
    const n=x.dataset.n,a=x.dataset.a;
    if(a==='del'){const all=crSlots();delete all[n];try{localStorage.setItem('pixelyard.creative.maps',JSON.stringify(all));}catch(e){}renderCMaps();return;}
    const p=await crReadSlot(n);if(!p.ok){msg(p.err,true);return;}
    if(a==='dl'){crDownload(JSON.stringify({format:MAPFMT,version:1,name:p.name,saved:p.saved,counts:p.counts,spawn:p.spawn||[0,0,6,0],terrain:p.terrain||[],check:fnv(JSON.stringify(p.recs)),objects:p.recs}),crFileName(p.name));return;}
    if(CR.objs.length&&!confirm('Replace the current world with "'+p.name+'"? Unsaved changes are lost.'))return;
    crApplyMap(p);hidePanes();lock();
  });
}
function goOnline(){
  if(G.net.role!=='host'||G.net.code)return;
  if(typeof Peer==='undefined'){toast('Online play is unavailable here.');return;}
  tryPeer(0,settings.pub!==false);hidePanes();lock();
}

/* ---- setup / teardown ---- */
function crReset(){
  trReset();
  if(CR.live&&CR.saveT>0&&CR.autosave&&!CR.ro)crSave();
  CR.live=false;CR.loadTok++;
  for(const o of CR.objs){
    if(o.type==='rect'&&o.mesh.geometry)o.mesh.geometry.dispose();
    if(o.type==='text'){o.mesh.material.dispose();o.tex.dispose();}
  }
  CR.matCache.forEach(m=>m.dispose());CR.matCache.clear();
  CR.glassCache.forEach(m=>m.dispose());CR.glassCache.clear();
  CR.texCache.forEach(t=>t.dispose());CR.texCache.clear();
  for(const k in CR.propModels)CR.propModels[k].geo.dispose();CR.propModels={};
  if(CR.propLit){CR.propLit.dispose();CR.propLit=null;}if(CR.propGlow){CR.propGlow.dispose();CR.propGlow=null;}
  CR.objs=[];CR.byId=new Map();CR.sel=null;CR.hov=null;CR.drag=null;CR.hh=null;CR.tool='select';CR.mode='move';CR.prevL=CR.prevR=false;CR.ghKey='';CR.ghKind='';CR.saveT=0;CR.lastPaint=null;
  CR.busy=false;CR.ro=false;CR.net=crNetNew();CR.spawn=null;CR.cullT=0;
  crProgHide();
}
function crEnsureGeo(){
  if(!CR.boxG){CR.boxG=new THREE.BoxGeometry(1,1,1);CR.planeG=new THREE.PlaneGeometry(1,1);CR.boxE=new THREE.EdgesGeometry(CR.boxG);CR.planeE=new THREE.EdgesGeometry(CR.planeG);}
  if(!CR.frames.length)CR.frames=[0,1,2].map(a=>{const X=AX[WAX[a][0]],Y=AX[WAX[a][1]],Z=new V3().crossVectors(X,Y);return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(X,Y,Z));});
}
function crInit(boot){
  crReset();boot=boot||{};
  const sc=G.scene;
  crEnsureGeo();
  const lm=c=>{const l=new THREE.LineSegments(CR.boxE,new THREE.LineBasicMaterial({color:c,depthTest:false,transparent:true}));l.renderOrder=998;return l;};
  CR.selL=lm(0xffe066);CR.hovL=lm(0xffffff);
  CR.ghR=new THREE.Mesh(CR.boxG,new THREE.MeshBasicMaterial({color:0x66ccff,transparent:true,opacity:.4,depthWrite:false}));CR.ghR.visible=false;sc.add(CR.ghR);
  CR.ghW=new THREE.Mesh(CR.boxG,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.45,depthWrite:false}));CR.ghW.visible=false;sc.add(CR.ghW);
  CR.ghP=new THREE.Mesh(CR.boxG,new THREE.MeshBasicMaterial({color:0x66ccff,transparent:true,opacity:.5,depthWrite:false}));CR.ghP.visible=false;CR.ghKind='';sc.add(CR.ghP);
  const gt={type:'text',size:new V3(4,1,.04),txt:{str:'TEXT',color:'#ffffff'}};crTextMesh(gt);gt.mesh.material.opacity=.7;gt.mesh.visible=false;sc.add(gt.mesh);CR.ghT=gt;
  CR.gz=crBuildGizmo();sc.add(CR.gz.g);
  trInit();
  CR.live=true;CR.ro=boot.role==='client';CR.autosave=!CR.ro&&!boot.custom;
  CR.mapName=CR.ro?crMapName(boot.welcome&&boot.welcome.cm&&boot.welcome.cm.nm):boot.custom?boot.custom.name:crMapName(store.get('creative.name','MY MAP'));
  if(CR.ro){CR.net.state='loading';CR.busy=true;crProg('WAITING FOR MAP',-1);}
  else if(boot.custom){CR.spawn=boot.custom.spawn;trLoad(boot.custom.terrain||[]);crLoadRecords(boot.custom.recs,{spawn:true,label:'BUILDING MAP',onDone:boot.custom.onLoaded});}
  else crLoad();
  crRefresh();
}
function crStart(on,boot,play){
  const ed=on&&!play;
  $('hotbar').hidden=ed;$('hp').hidden=ed;$('chud').hidden=!ed||!!(boot&&boot.role==='client');$('cinfo').hidden=!ed;
  me.flying=false;me.jumps=0;me.spaceT=0;
  if(!on)crProgHide();
  if(on)crInit(boot);
  if(on&&play&&CR.gz)CR.gz.g.visible=false;
}

$('bMaps').onclick=()=>showPane('cmaps');

/* ================= main loop ================= */
function gameFrame(dt){
  G.time+=dt;
  updateLocal(dt);
  updateWeapon(dt);
  if(G.net.role==='host')stepProps(dt);
  updateRemotes(dt);
  updateDrones(dt);
  updateProps(dt);
  updateCars(dt);
  updateVehs(dt);
  if(G.pane==='props'&&propCat==='veh'){G.uiT=(G.uiT||0)+dt;if(G.uiT>.3){G.uiT=0;refreshVehCards();}}
  if(G.net.role==='host')stepNpcs(dt);
  updateNpcViews(dt);
  updateBombs(dt);updateMissiles(dt);
  netTick(dt);
  updateCamera(dt);
  if(CRE())trFlush();
  if(EDIT())updateCreative(dt);else if(CRE())crCullTick(dt);
  updateFX(dt);
  updateHUD();
  renderer.render(G.scene,cam);
}
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.mode==='menu')lobbyFrame(dt,now/1000);
  else if(G.scene)gameFrame(dt);
}
resize();
makeItemIcons();makeVehIcons();initSkin();
buildLobby();
requestAnimationFrame(loop);
})();
