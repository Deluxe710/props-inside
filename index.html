*{box-sizing:border-box}

.menu{display:flex;flex-direction:column;gap:14px;margin:6px 0}
.panel{background:var(--panel);padding:18px;box-shadow:0 0 0 3px var(--line),6px 6px 0 3px #000a;display:flex;flex-direction:column;gap:14px}

.maps{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.mapcard:hover{box-shadow:0 0 0 3px var(--ember);background:#2c2c2c}

  linear-gradient(#86cdf5 0 45%,transparent 45%),

  linear-gradient(#f2c48a 0 45%,transparent 45%),

#hotbar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:30}

.more{width:44px;height:68px;background:#0a0a0add;border:0;cursor:pointer;font-family:var(--display);font-size:14px;color:var(--amber);box-shadow:0 0 0 3px #000,inset 0 0 0 3px var(--line)}
.more:hover{background:#2c2c2c;color:var(--bone)}

.small{font-size:19px;color:var(--dim);margin:-6px 0 0}
.codebox{display:flex;gap:10px;align-items:center;background:#050505;padding:12px;box-shadow:0 0 0 3px var(--amber)}
.codebox b{font-family:var(--display);font-size:22px;font-weight:400;letter-spacing:4px;color:var(--amber);flex:1}
.codebox .btn{padding:10px 12px;font-size:11px}
.row{display:flex;align-items:center;gap:14px}
.row label{flex:0 0 150px;font-size:22px}
.row input[type=range]{flex:1;accent-color:var(--ember)}

.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tabs .btn{padding:10px 14px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;overflow:auto;padding:6px 6px 10px}
.card{background:var(--panel2);border:0;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 0 0 3px var(--line);text-align:center}
.card:hover{box-shadow:0 0 0 3px var(--ember);background:#2c2c2c}
.card img{width:72px;height:72px;image-rendering:pixelated}
.card b{font-family:var(--display);font-weight:400;font-size:10px}
.card span{font-size:17px;color:var(--dim);line-height:1}
.readyTitle{font-size:26px;text-align:center}

<body>
<canvas id="c"></canvas>

<!-- LOBBY: menu left, interactive character right (3D) -->
<div id="lobby">
  <div class="side">
    <h1 class="logo">PROPS<br>INSIDE</h1>
    <p class="tagline">Build. Throw. Shoot your friends.</p>
    <label class="field">CALLSIGN<input id="nameInput" maxlength="12" spellcheck="false" autocomplete="off"></label>
    <nav class="menu">
      <button class="btn big" data-tab="skins">SKINS</button>
      <button class="btn big" data-tab="host">HOST</button>
      <button class="btn big primary" data-tab="play">PLAY</button>
    </nav>
    <section id="tab" class="panel" hidden></section>
    <p id="netStatus" class="status"></p>
  </div>
  <p class="dragHint">DRAG TO TURN · CLICK TO SAY HI</p>
</div>

<!-- HUD -->
<div id="hud" hidden>
  <div id="scope"></div><div id="cross"></div>
  <div id="hitmark"></div>
  <div id="dmg"></div>
  <div id="badge"><span id="badgeCode"></span><span id="badgeCount"></span></div>
  <div id="feed"></div>
  <div id="chatlog"></div>
  <input id="chatIn" maxlength="120" placeholder="Type a message, Enter to send" autocomplete="off" spellcheck="false" hidden>
  <div id="hint"></div>

      const w=img.width,h=img.height;

function tone(f,d,type,v,slide){

  const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),dat=b.getChannelData(0);

}

const PV={r:null,sc:null,cam:null,raf:0,rot:.7,top:false,drag:false,rad:30,ctr:new V3(),own:[]};
function pvStop(){
  if(PV.raf)cancelAnimationFrame(PV.raf);PV.raf=0;
  for(const g of PV.own){try{g.dispose();}catch(e){}}PV.own=[];
  if(PV.r){try{PV.r.dispose();PV.r.forceContextLoss();}catch(e){}}
  PV.r=null;PV.sc=null;
}
function pvStart(canvas,c){
  pvStop();crEnsureGeo();
  let r;try{r=new THREE.WebGLRenderer({canvas,antialias:false});}catch(e){return false;}
  r.setPixelRatio(1);r.setSize(canvas.width,canvas.height,false);r.setClearColor(0x86cdf5);
  const sc=new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xdff3ff,0x6a7a5a,.95));
  const dl=new THREE.DirectionalLight(0xfff2cc,.8);dl.position.set(30,60,20);sc.add(dl);
  const gnd=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshLambertMaterial({color:0x8a9684}));gnd.rotation.x=-Math.PI/2;sc.add(gnd);PV.own.push(gnd.geometry,gnd.material);
  const grid=new THREE.GridHelper(480,96,0x56604f,0x77826f);grid.position.y=.02;sc.add(grid);PV.own.push(grid.geometry,grid.material);
  const wins=new Map();
  for(const q of c.recs)if(q.t==='window'){if(!wins.has(q.h))wins.set(q.h,[]);wins.get(q.h).push(q);}
  for(const q of c.recs){
    if(q.t==='window')continue;
    const pos=new V3(q.p[0],q.p[1],q.p[2]),quat=new THREE.Quaternion(q.q[0],q.q[1],q.q[2],q.q[3]);
    let mesh;
    if(q.t==='rect'){
      const po={size:new V3(q.s[0],q.s[1],q.s[2]),wins:(wins.get(q.i)||[]).map(w=>({a:w.a,cu:w.u,cv:w.v,size:{x:w.s[0],y:w.s[1]}}))};
      po.pieces=crPieces(po);const geo=crBuildGeo(po);PV.own.push(geo);
      mesh=new THREE.Mesh(geo,crMaterial(q.m,q.c));
      mesh.position.copy(pos);mesh.quaternion.copy(quat);sc.add(mesh);
      for(const w of wins.get(q.i)||[]){
        const pose=crWinPose({pos,quat},w.a,w.u,w.v),gm=new THREE.Mesh(CR.boxG,crGlass(w.c,w.o));
        gm.position.copy(pose.pos);gm.quaternion.copy(pose.quat);gm.scale.set(w.s[0],w.s[1],WTHICK);sc.add(gm);
      }
    }else if(q.t==='text'){
      const to={type:'text',size:new V3(q.s[0],q.s[1],.04),txt:{str:q.x.str,color:q.x.color}};
      crTextMesh(to);PV.own.push(to.mesh.material,to.tex);
      to.mesh.position.copy(pos);to.mesh.quaternion.copy(quat);to.mesh.scale.set(q.s[0],q.s[1],1);sc.add(to.mesh);
    }else{
      mesh=new THREE.Mesh(crPropModel(q.n).geo,crPropMats(q.c));
      mesh.position.copy(pos);mesh.quaternion.copy(quat);mesh.scale.set(q.s[0],q.s[1],q.s[2]);sc.add(mesh);
    }
  }
  const b=c.bounds;PV.ctr.set((b.x0+b.x1)/2,Math.max(0,b.y1*.3),(b.z0+b.z1)/2);
  PV.rad=Math.max(14,Math.max(b.x1-b.x0,b.z1-b.z0,b.y1)*.95);
  PV.r=r;PV.sc=sc;PV.cam=new THREE.PerspectiveCamera(50,canvas.width/canvas.height,.5,3000);
  const pointer=e=>{if(PV.drag)PV.rot-=e.movementX*.01;};
  canvas.onpointerdown=e=>{PV.drag=true;try{canvas.setPointerCapture(e.pointerId);}catch(x){}};
  canvas.onpointerup=canvas.onpointercancel=()=>{PV.drag=false;};
  canvas.onpointermove=pointer;
  canvas.onwheel=e=>{e.preventDefault();PV.rad=clamp(PV.rad*(e.deltaY>0?1.1:.9),6,900);};
  const frame=()=>{
    if(!PV.r)return;PV.raf=requestAnimationFrame(frame);
    if(!PV.drag)PV.rot+=.006;
    const R=PV.rad,cm=PV.cam;
    if(PV.top)cm.position.set(PV.ctr.x,PV.ctr.y+R*1.5,PV.ctr.z+R*.02);
    else cm.position.set(PV.ctr.x+Math.sin(PV.rot)*R*.95,PV.ctr.y+R*.6,PV.ctr.z+Math.cos(PV.rot)*R*.95);
    cm.lookAt(PV.ctr);PV.r.render(PV.sc,cm);
  };
  frame();return true;
}

function rebuildLobbyChar(){

}
function lobbyEmote(){
  const list=['wave','hop','spin','dance'];
  const prev=L.emote?L.emote.name:'';
  let n;do{n=list[Math.floor(Math.random()*list.length)];}while(n===prev);
  L.emote={name:n,t0:performance.now()/1000};
  sfx('hey');
}
function lobbyFrame(dt,t){
  const ch=L.char,u=ch.userData;
  L.rotY+=(L.targetRot-L.rotY)*Math.min(1,dt*9);
  let rot=L.rotY,hop=0,wave=0,dance=0;
  if(L.emote){
    const e=t-L.emote.t0,dur=1.8;
    if(e>dur)L.emote=null;
    else{
      const k=e/dur;
      if(L.emote.name==='wave')wave=1;
      else if(L.emote.name==='hop')hop=Math.abs(Math.sin(k*Math.PI*3))*.5;
      else if(L.emote.name==='spin'){rot+=k*Math.PI*4;hop=Math.sin(k*Math.PI)*.4;}
      else dance=1;
    }
  }
  ch.rotation.y=rot;
  ch.position.y=.45+hop+(dance?Math.abs(Math.sin(t*9))*.18:0);
  const breathe=Math.sin(t*2)*.012;
  u.torsoBreath=breathe;
  u.head.position.y=(u.headY||1.35)+breathe;
  u.head.rotation.y=clamp((L.mx-.72)*1.8,-.7,.7);
  u.head.rotation.x=clamp(-(L.my-.35)*.9,-.5,.5);
  u.armR.rotation.z=wave?2.6+Math.sin(t*14)*.35:(dance?2.4+Math.sin(t*9)*.4:-.05);
  u.armL.rotation.z=dance?-2.4-Math.sin(t*9)*.4:.05;
  u.armR.rotation.x=0;u.armL.rotation.x=0;
  u.legL.rotation.x=dance?Math.sin(t*9)*.5:0;u.legR.rotation.x=dance?-Math.sin(t*9)*.5:0;
  L.lights.forEach((l,i)=>{l.intensity=1.5+Math.sin(t*13+i*2)*.25+Math.random()*.2;});
  L.flames.forEach((f,i)=>{f.scale.y=1+Math.sin(t*15+i)*.25;});
  for(const e of L.embers){e.position.y+=e.userData.s*dt;e.position.x+=Math.sin(t*2+e.position.y)*dt*.2;if(e.position.y>6.5){e.position.y=0;e.position.x=(Math.random()-.5)*14;}}
  renderer.render(L.scene,lobbyCam);
}
canvas.addEventListener('pointerdown',e=>{
  if(G.mode!=='menu')return;
  L.drag={x:e.clientX,moved:0,rot:L.targetRot};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  L.mx=e.clientX/innerWidth;L.my=e.clientY/innerHeight;
  if(G.mode==='menu'&&L.drag){const dx=e.clientX-L.drag.x;L.drag.moved=Math.max(L.drag.moved,Math.abs(dx));L.targetRot=L.drag.rot+dx*.012;}
});
canvas.addEventListener('pointerup',e=>{
  if(G.mode!=='menu'||!L.drag)return;
  const moved=L.drag.moved;L.drag=null;
  if(moved<6){
    L.ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},lobbyCam);
    if(L.ray.intersectObject(L.char,true).length)lobbyEmote();
  }
});

function stepProps(dt){
  const sub=2,h=dt/sub;const pushers=[];if(me.alive&&me.inv[me.slot]===FIST&&!me.car&&!me.veh)pushers.push(me.pos);for(const pl of players.values())if(pl.alive&&pl.item===FIST&&!riding(pl.id))pushers.push(pl.pos);
  const vb=vehBoxes(),cl=vb.length?G.colliders.concat(vb):G.colliders;
  for(const p of props.values()){
    if(p.fuse!==undefined&&G.time>=p.fuse){
      const q=p.pos.clone();removeProp(p.id,true);
      hostBoom(q.x,q.y,q.z,7,80,p.owner);
      continue;
    }
    if(p.stuck)continue;
    const hx=p.half[0],hy=p.half[1],hz=p.half[2];
    if(p.sleep>1.2){
      for(const q of pushers){if(p.pos.x+hx>q.x-PW-.15&&p.pos.x-hx<q.x+PW+.15&&p.pos.z+hz>q.z-PW-.15&&p.pos.z-hz<q.z+PW+.15&&p.pos.y-hy<q.y+PH)p.sleep=0;}
      for(const c of vb){if(c.mv>.25&&p.pos.x+hx>c.x0-.5&&p.pos.x-hx<c.x1+.5&&p.pos.z+hz>c.z0-.5&&p.pos.z-hz<c.z1+.5&&p.pos.y-hy<c.y1+.5&&p.pos.y+hy>c.y0-.5)p.sleep=0;}
      if(p.sleep>1.2)continue;
    }
    for(let s=0;s<sub;s++){
      p.vel.y-=22*h;
      p.pos.x+=p.vel.x*h;p.pos.y+=p.vel.y*h;p.pos.z+=p.vel.z*h;
      p.onGround=false;
      const gy=trH(p.pos.x,p.pos.z);
      if(p.pos.y-hy<gy){
        p.pos.y=gy+hy;
        if(p.vel.y<0){p.vel.y=-p.vel.y*p.bounce;if(Math.abs(p.vel.y)<1.2)p.vel.y=0;}
        p.onGround=true;
        if(p.item.remote&&!p.stuck){p.pos.y=gy+p.half[1]+.005;p.face=1;p.stuck=true;p.vel.set(0,0,0);p.sleep=2;p.spin=0;bc({t:'pstick',id:p.id,f:1,x:r2(p.pos.x),y:r2(p.pos.y),z:r2(p.pos.z)});}
      }
      if(p.stuck)break;
      for(const c of cl){
        if(p.pos.x+hx<=c.x0||p.pos.x-hx>=c.x1||p.pos.y+hy<=c.y0||p.pos.y-hy>=c.y1||p.pos.z+hz<=c.z0||p.pos.z-hz>=c.z1)continue;
        const penX=Math.min(p.pos.x+hx-c.x0,c.x1-(p.pos.x-hx));
        const penY=Math.min(p.pos.y+hy-c.y0,c.y1-(p.pos.y-hy));
        const penZ=Math.min(p.pos.z+hz-c.z0,c.z1-(p.pos.z-hz));
        if(penX<=penY&&penX<=penZ){
          if(p.pos.x<(c.x0+c.x1)/2)p.pos.x=c.x0-hx;else p.pos.x=c.x1+hx;
          p.vel.x=-p.vel.x*p.bounce;
          if(p.item.remote&&!p.stuck&&c.mv===undefined){stickProp(p,c,p.pos.x<(c.x0+c.x1)/2?4:3);break;}
        }else if(penZ<=penY){
          if(p.pos.z<(c.z0+c.z1)/2)p.pos.z=c.z0-hz;else p.pos.z=c.z1+hz;
          p.vel.z=-p.vel.z*p.bounce;
          if(p.item.remote&&!p.stuck&&c.mv===undefined){stickProp(p,c,p.pos.z<(c.z0+c.z1)/2?6:5);break;}
        }else{
          if(p.pos.y<(c.y0+c.y1)/2)p.pos.y=c.y0-hy;else{p.pos.y=c.y1+hy;p.onGround=true;}
          p.vel.y=Math.abs(p.vel.y)<1.2?0:-p.vel.y*p.bounce;
          if(p.item.remote&&!p.stuck&&c.mv===undefined){stickProp(p,c,p.pos.y<(c.y0+c.y1)/2?2:1);break;}
        }
      }
      /* props collide with (and stack on) each other */
      if(p.stuck)break;
      for(const q of props.values()){
        if(q===p)continue;
        const qx=q.half[0],qy=q.half[1],qz=q.half[2];
        const dx=p.pos.x-q.pos.x,dy=p.pos.y-q.pos.y,dz=p.pos.z-q.pos.z;
        const ox=hx+qx-Math.abs(dx),oy=hy+qy-Math.abs(dy),oz=hz+qz-Math.abs(dz);
        if(ox<=0||oy<=0||oz<=0)continue;
        if(oy<=ox&&oy<=oz){
          if(dy>=0){
            p.pos.y+=oy;
            if(p.vel.y<q.vel.y){const rv=q.vel.y-p.vel.y;p.vel.y=rv<1.2?q.vel.y:q.vel.y+rv*p.bounce*.5;}
            p.onGround=true;
            if(rv0(p,q)){q.sleep=0;}
          }else{p.pos.y-=oy;if(p.vel.y>q.vel.y)p.vel.y=q.vel.y;}
        }else{
          const ax=ox<=oz?'x':'z',o=ax==='x'?ox:oz,sg=(ax==='x'?dx:dz)>=0?1:-1;
          const qs=q.sleep>1.2,w=qs?1:q.m/(p.m+q.m);
          p.pos[ax]+=sg*o*w;if(!qs)q.pos[ax]-=sg*o*(1-w);
          const rel=p.vel[ax]-q.vel[ax];
          if(rel*sg<0){
            const j=-rel*(1.2)/(1/p.m+1/q.m);
            if(qs&&Math.abs(j/q.m)<.5){p.vel[ax]*=-.1;}
            else{p.vel[ax]+=j/p.m;q.vel[ax]-=j/q.m;q.sleep=0;if(Math.abs(j)>3)q.spin=(Math.random()-.5)*6;}
          }
        }
      }
      p.pos.x=clamp(p.pos.x,-LIM,LIM);p.pos.z=clamp(p.pos.z,-LIM,LIM);
    }
    if(p.onGround){const f=Math.exp(-p.fr*dt);p.vel.x*=f;p.vel.z*=f;p.spin*=Math.exp(-3*dt);}
    p.yaw+=p.spin*dt;
    const sp=p.vel.length();
    if(p.onGround&&sp<.12){p.sleep+=dt;if(p.sleep>1.2)p.vel.set(0,0,0);}else p.sleep=0;
    /* players push props and get hit by fast ones */
    const list=[[me.id,me.pos,me.alive&&(!me.veh||isGunner()),me.inv[me.slot]===FIST&&!me.car&&!me.veh]];
    for(const pl of players.values())list.push([pl.id,pl.pos,pl.alive&&(!riding(pl.id)||!!passSeat(pl.id)),pl.item===FIST]);
    for(const[pid,pp,alive,pushes]of list){
      if(!alive)continue;
      if(p.pos.x+hx<=pp.x-PW||p.pos.x-hx>=pp.x+PW||p.pos.z+hz<=pp.z-PW||p.pos.z-hz>=pp.z+PW||p.pos.y-hy>=pp.y+PH||p.pos.y+hy<=pp.y+.05)continue;
      if(sp>9&&(pid!==p.owner||G.time-p.born>.6)&&(!p.hitCd[pid]||G.time-p.hitCd[pid]>.7)){
        p.hitCd[pid]=G.time;
        const dmg=Math.round(clamp(sp*p.m*1.2,5,45));
        sendHit(pid,dmg,p.owner);
        p.vel.multiplyScalar(.5);
      }
      if(!pushes)continue;
      const dx=p.pos.x-pp.x,dz=p.pos.z-pp.z;
      const ox=PW+hx-Math.abs(dx),oz=PW+hz-Math.abs(dz);
      if(ox<oz){const sg=dx>=0?1:-1;p.pos.x+=sg*ox;p.vel.x+=sg*2.5/p.m;}
      else{const sg=dz>=0?1:-1;p.pos.z+=sg*oz;p.vel.z+=sg*2.5/p.m;}
      p.sleep=0;
    }
  }
}
function rv0(p,q){return q.sleep>1.2&&p.vel.y<-4;}
function updateProps(dt){
  const host=G.net.role==='host';
  for(const p of props.values()){
    if(!host){
      p.pos.lerp(p.tpos,Math.min(1,dt*14));
      let dy=p.tyaw-p.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));p.yaw+=dy*Math.min(1,dt*14);
    }
    p.mesh.position.copy(p.pos);
    if(p.face>1)p.mesh.quaternion.setFromUnitVectors(UPV,FACEN[p.face]);else p.mesh.rotation.y=p.yaw;
    if(p.armedAt!==null){p.mesh.scale.setScalar(1+.07*Math.sin((G.time-p.armedAt)*(10+(G.time-p.armedAt)*4)));}
  }
}

/* ================= networking ================= */
const PREFIX='propsinside-';
// Use the public PeerJS signaling service plus multiple STUN servers so browsers
// on different Chromebooks can discover each other and negotiate WebRTC.
function makePeer(id){
  const options={debug:1,host:'0.peerjs.com',port:443,path:'/',secure:true,
    config:{iceServers:[
      {urls:'stun:stun.l.google.com:19302'},
      {urls:'stun:stun.cloudflare.com:3478'},
      {urls:'stun:stun1.l.google.com:19302'}
    ]}};
  return id?new Peer(id,options):new Peer(options);
}
function genCode(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[Math.floor(Math.random()*a.length)];return s;}
function bc(m){for(const c of G.conns.values()){try{if(c.open)c.send(m);}catch(e){}}}
function bcExcept(id,m){for(const[pid,c]of G.conns){if(pid===id)continue;try{if(c.open)c.send(m);}catch(e){}}}
function sendHost(m){const c=G.net.hostConn;if(c&&c.open){try{c.send(m);}catch(e){}}}
/* run an effect locally, then pass it on through the host */
function fireEvent(m){m.f=m.f===undefined?me.id:m.f;onEvent(m);if(G.net.role==='host')hostHandle(m,0);else sendHost(m);}
function sendHit(to,dmg,from){
  if(to===me.id){damageMe(dmg,from);return;}
  const m={t:'hit',to,dmg,f:from};
  if(G.net.role==='host'){const c=G.conns.get(to);if(c&&c.open)c.send(m);}else sendHost(m);
}
function updateBadge(){
  const code=G.net.code;
  if(EDIT()&&!code&&G.net.role!=='client'){$('badgeCode').innerHTML='<b>CREATIVE</b>';$('badgeCount').innerHTML='SOLO';return;}
  $('badgeCode').innerHTML=code?'CODE <b>'+code+'</b>':(G.net.role==='host'?'CODE <b>...</b>':'<b>OFFLINE</b>');
  $('badgeCount').innerHTML='PLAYERS <b>'+(1+players.size)+'</b>';
}
function startHost(mapId,custom,solo){
  if(custom&&!solo&&typeof Peer!=='undefined')custom=Object.assign({},custom,{onLoaded:()=>{if(G.mode==='play'&&G.net.role==='host'&&!G.net.code)tryPeer(0,settings.pub!==false);}});
  startGame(mapId,'host',null,custom);
  if(mapId==='creative'&&(!custom||solo)){G.net.code=null;updateBadge();if(!custom)toast('Creative is private until you press ESC > GO ONLINE. Your build is saved on this device.');return;}
  if(typeof Peer==='undefined'){toast('Online play is unavailable here. You are playing solo.');G.net.code=null;updateBadge();return;}
  if(!custom)tryPeer(0,settings.pub!==false);
}
/* public servers live in fixed slots PUB01..PUB12 so the browser can probe them without a backend */
const PUBN=12;
const pubCode=i=>'PUB'+String(i+1).padStart(2,'0');
function listServers(cb){
  let peer,finished=false,miss=0;const found=[];
  try{peer=makePeer();}catch(e){setTimeout(()=>cb([],true),0);return()=>{};}
  const done=()=>{if(finished)return;finished=true;clearTimeout(t);try{peer.destroy();}catch(e){}cb(found,true);};
  const t=setTimeout(done,7000);
  peer.on('error',e=>{if(e.type==='peer-unavailable'){miss++;if(miss+found.length>=PUBN)done();}else done();});
  peer.on('open',()=>{
    for(let i=0;i<PUBN;i++){
      const code=pubCode(i);let got=false,conn;
      try{conn=peer.connect(PREFIX+code,{reliable:true,serialization:'json'});}catch(e){miss++;continue;}
      conn.on('open',()=>{try{conn.send({t:'info'});}catch(e){}});
      conn.on('data',m=>{
        if(finished||got||!m||m.t!=='info')return;
        got=true;
        found.push({code,host:sanitizeName(m.host),map:m.map,mapName:m.cmn?'CUSTOM: '+crMapName(m.cmn):(MAPS[m.map]?MAPS[m.map].name:'?'),n:clamp(m.n|0,1,8),max:clamp(m.max|0,1,8)});
        cb(found,false);
        if(miss+found.length>=PUBN)done();
        setTimeout(()=>{try{conn.close();}catch(e){}},200);
      });
    }
  });
  return()=>{if(finished)return;finished=true;clearTimeout(t);try{peer.destroy();}catch(e){}};
}
function tryPeer(attempt,wantPub){
  const pub=wantPub&&attempt<PUBN;
  const code=pub?pubCode(attempt):genCode();let peer;
  try{peer=makePeer(PREFIX+code);}catch(e){toast('Could not start networking. Check your internet connection.');return;}
  peer.on('open',()=>{
    if(G.net.role!=='host'||G.mode!=='play'){try{peer.destroy();}catch(e){}return;}
    G.net.peer=peer;G.net.code=code;G.net.pub=pub;updateBadge();toast(pub?'Public server is live! Code: '+code:'Private lobby code: '+code);
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&attempt<PUBN+8){try{peer.destroy();}catch(x){}tryPeer(attempt+1,wantPub);}
    else if(!G.net.code)toast('Network error ('+e.type+'). Check internet and try again.');
  });
  peer.on('disconnected',()=>{if(G.net.role==='host'&&G.net.peer===peer){try{peer.reconnect();}catch(e){}}});
  peer.on('connection',conn=>onHostConn(conn));
}
function onHostConn(conn){
  let pid=null;
  conn.on('data',m=>{
    if(!m||typeof m!=='object')return;
    if(m.t==='info'&&pid===null){
      try{conn.send({t:'info',host:me.name,map:G.mapId,n:1+players.size,max:8,cmn:CRE()?CR.mapName:undefined});}catch(e){}
      setTimeout(()=>{try{conn.close();}catch(e){}},300);
      return;
    }
    if(m.t==='hello'&&pid===null){
      if(players.size>=7){try{conn.send({t:'full'});}catch(e){}setTimeout(()=>conn.close(),200);return;}
      pid=G.nextId++;G.conns.set(pid,conn);
      const info={id:pid,name:sanitizeName(m.name),color:clamp(m.color|0,0,COLORS.length-1),of:clamp(m.of|0,0,OUTFITS.length-1)};
      addRemote(info);
      const pl=allInfos();
      const pr=[];for(const p of props.values())pr.push({id:p.id,type:p.type,x:r2(p.pos.x),y:r2(p.pos.y),z:r2(p.pos.z),yaw:r2(p.yaw),f:p.face|0});
      const vl=[];for(const v of vehs.values())vl.push({id:v.id,kind:v.kind,x:r2(v.pos.x),y:r2(v.pos.y),z:r2(v.pos.z),yaw:r2(v.yaw),owner:v.owner,col:v.col,hp:Math.round(v.hp),s:v.seats});
      conn.send({t:'welcome',id:pid,map:G.mapId,players:pl,props:pr,veh:vl,npc:G.npcOn?1:0,cm:CRE()?{nm:CR.mapName,rev:CR.net.rev}:undefined,cp:G.cplay?1:undefined});
      if(CRE()&&!CR.busy)crSendSnap(conn);
      if(profile.skin)conn.send({t:'skinimg',id:0,d:profile.skin});
      for(const q of players.values())if(q.id!==pid&&q.skinData)conn.send({t:'skinimg',id:q.id,d:q.skinData});
      bcExcept(pid,{t:'join',p:info});
      feed(info.name+' joined');
    }else if(pid!==null)hostHandle(m,pid);
  });
  conn.on('close',()=>{if(pid!==null&&G.mode==='play')removePlayer(pid,true);});
  conn.on('error',()=>{});
}
function joinGame(raw){
  const code=String(raw||'').trim().toUpperCase();
  if(code.length!==5){setStatus('Enter the 5 character lobby code.',true);return;}
  if(typeof Peer==='undefined'){setStatus('Online play needs internet access to load PeerJS.',true);return;}
  setStatus('Connecting...');
  let done=false,peer=null;
  const fail=msg=>{if(done)return;done=true;clearTimeout(to);setStatus(msg,true);try{peer&&peer.destroy();}catch(e){}};
  const to=setTimeout(()=>fail('Connection timed out. Check the code and internet connection.'),25000);
  try{peer=makePeer();}catch(e){fail('Could not start networking. Check your internet connection.');return;}
  peer.on('error',e=>{if(!done)fail(e.type==='peer-unavailable'?'No lobby with that code.':'Network error ('+e.type+').');});
  peer.on('disconnected',()=>{if(!done){try{peer.reconnect();}catch(e){}}});
  peer.on('open',()=>{
    const conn=peer.connect(PREFIX+code,{reliable:true,serialization:'json'});
    conn.on('open',()=>conn.send({t:'hello',name:profile.name,color:profile.color,of:profile.outfit}));
    conn.on('error',()=>{if(!done)fail('Could not connect. Check the lobby code and try again.');});
    conn.on('data',m=>{
      if(!m||typeof m!=='object')return;
      if(m.t==='welcome'&&!done){
        done=true;clearTimeout(to);
        G.net.peer=peer;G.net.hostConn=conn;
        startGame(m.map,'client',m);
        G.net.code=code;updateBadge();
        if(profile.skin)sendHost({t:'skinimg',d:profile.skin});
        toast('Joined lobby '+code);
      }else if(m.t==='full'){fail('That lobby is full.');}
      else clientHandle(m);
    });
    conn.on('close',()=>{if(!done)fail('Could not connect to that lobby.');else if(G.mode==='play'&&G.net.role==='client')leaveToMenu('Host closed the lobby.');});
  });
}
function netClose(){
  const peer=G.net.peer;
  try{if(G.net.role==='host')bc({t:'stop'});}catch(e){}
  try{if(G.net.hostConn)G.net.hostConn.close();}catch(e){}
  setTimeout(()=>{try{peer&&peer.destroy();}catch(e){}},250);
  G.conns.clear();
  G.net={role:'none',peer:null,hostConn:null,code:null};
}
function stopHosting(){
  if(G.net.role!=='host')return;
  bc({t:'stop'});
  const peer=G.net.peer;
  setTimeout(()=>{try{peer&&peer.destroy();}catch(e){}},250);
  for(const id of[...players.keys()])removePlayer(id,false);
  G.conns.clear();G.net.peer=null;G.net.code=null;
  updateBadge();toast('Hosting stopped. You are playing solo.');
  $('codeText').textContent='OFFLINE';
}

/* host receives from clients (and from itself) */
function hostHandle(m,from){
  switch(m.t){
    case 'st':{
      const p=players.get(from);if(!p)break;
      p.tpos.set(m.x,m.y,m.z);p.tyaw=m.yaw;p.pitch=m.pitch;p.hp=m.hp;p.alive=!!m.al;p.item=m.it;
      break;
    }
    case 'hit':{
      if(m.to===me.id)damageMe(m.dmg,m.f);
      else{const c=G.conns.get(m.to);if(c&&c.open)c.send(m);}
      break;
    }
    case 'chat':{
      if(from===0)break;
      const tx=cleanChat(m.text);if(!tx)break;
      addChat(from,tx);bcExcept(from,{t:'chat',id:from,text:tx});
      break;
    }
    case 'mapr':{const c=G.conns.get(from);if(c&&CRE())crSendSnap(c);break;}
    case 'mapok':{const q=players.get(from);if(q&&CRE())feed(q.name+' loaded the map');break;}
    case 'det':{if(from!==0)hostDetonate(from);break;}
    case 'nhit':{if(from!==0)hitNpc(m.id|0,clamp(+m.dmg||0,0,200),from);break;}
    case 'skinimg':{
      if(from===0)break;
      const q=players.get(from);if(!q)break;
      const d=(typeof m.d==='string'&&m.d.length<60000&&m.d.indexOf('data:image/png;base64,')===0)?m.d:'';
      applySkinData(q,d);bcExcept(from,{t:'skinimg',id:from,d});break;
    }
    case 'vspawn':{if(from!==0&&(isCar(m.kind)||m.kind==='tank'||m.kind==='heli'||m.kind==='b2'))hostSpawnVeh(m.kind,from);break;}
    case 'venter':{const v=vehs.get(m.id);if(v&&from!==0)hostSeat(v,from);break;}
    case 'vexit':{const v=vehs.get(m.id);if(v)hostUnseat(v,from);break;}
    case 'vst':{const v=vehs.get(m.id);if(v&&v.seats[0]===from&&from!==0){v.tpos.set(m.x,m.y,m.z);v.tyaw=m.yaw;v.taux=m.a;v.ttu=m.tu;}break;}
    case 'vhit':{const v=vehs.get(m.id);if(v&&from!==0)applyVehDmg(v.id,clamp(+m.dmg||0,0,200)*v.K.armor,from);break;}
    case 'mhit':{const v=vehs.get(m.id);if(v&&from!==0)applyVehDmg(v.id,v.K.hp*GY.DMG,from);break;}
    case 'shot':case 'tshot':case 'boom':case 'dead':case 'skin':case 'drn':case 'dpos':case 'bomb':case 'msl':case 'mend':{
      if(from!==0){m.f=from;if(m.t==='dead'||m.t==='skin')m.id=from;onEvent(m);}
      bcExcept(from,m);
      break;
    }
    case 'spawn':{
      if(from===0)break;
      const p=players.get(from);if(!p)break;
      spawnProp(m.type|0,m.x,m.y,m.z,m.vx,m.vy,m.vz,from,(m.f|0)>=1&&(m.f|0)<=6?(m.f|0):0);
      break;
    }
    case 'enter':{const c=carById(m.id);if(c&&c.drv<0&&from!==0){c.drv=from;bc({t:'cdrv',id:m.id,drv:from});}break;}
    case 'exit':{const c=carById(m.id);if(c&&c.drv===from){c.drv=-1;bc({t:'cdrv',id:m.id,drv:-1});}break;}
    case 'car':{const c=carById(m.id);if(c&&c.drv===from){c.tpos.set(m.x,0,m.z);c.tyaw=m.yaw;}break;}
    case 'imp':{
      const p=props.get(m.id);if(!p)break;
      p.vel.x+=clamp(m.vx,-30,30)/p.m;p.vel.y+=clamp(m.vy,-30,30)/p.m;p.vel.z+=clamp(m.vz,-30,30)/p.m;
      p.spin=(Math.random()-.5)*10;p.sleep=0;
      break;
    }
  }
}
/* clients receive from host */
function clientHandle(m){
  switch(m.t){
    case 'snap':{
      for(const a of m.pl){
        const id=a[0];if(id===me.id)continue;
        const p=players.get(id);if(!p)continue;
        p.tpos.set(a[1],a[2],a[3]);p.tyaw=a[4];p.pitch=a[5];p.hp=a[6];p.item=a[7];p.alive=!!a[8];
      }
      for(const a of m.pr){const p=props.get(a[0]);if(p){p.tpos.set(a[1],a[2],a[3]);p.tyaw=a[4];if(a[5]!==undefined)p.face=a[5]|0;}}
      if(m.cr)for(const a of m.cr){const c=carById(a[0]);if(!c||c===me.car)continue;c.drv=a[4];c.tpos.set(a[1],0,a[2]);c.tyaw=a[3];}
      if(m.vh)for(const a of m.vh){const v=vehs.get(a[0]);if(!v)continue;v.hp=a[7];if(a[8].join()!==v.seats.join())setSeats(v,a[8]);if(me.veh===v&&v.seats[0]===me.id)continue;v.tpos.set(a[1],a[2],a[3]);v.tyaw=a[4];v.taux=a[5];v.ttu=a[6];}
      if(m.np)for(const a of m.np){const n=G.npcs[a[0]];if(n){n.tpos.set(a[1],a[2],a[3]);n.tyaw=a[4];n.st=a[5];}}
      break;
    }
    case 'terr':if(CRE()&&TR.h)trApply(trClean(m.c||[]),!!m.rs);break;
    case 'mapb':if(CRE()&&CR.ro)crNetHead(m);break;
    case 'mapc':if(CRE()&&CR.ro)crNetChunk(m);break;
    case 'mop':crNetOp(m);break;
    case 'chat':{const tx=cleanChat(m.text);if(tx)addChat(m.id|0,tx);break;}
    case 'npc':setNpcs(m.on);break;
    case 'cdrv':{const c=carById(m.id);if(c){c.drv=m.drv;if(m.drv===me.id)beginDrive(c);else if(me.car===c)me.car=null;}break;}
    case 'join':addRemote(m.p);feed(sanitizeName(m.p.name)+' joined');break;
    case 'left':{const p=players.get(m.id);if(p){feed(p.name+' left');}removePlayer(m.id,false);break;}
    case 'hit':damageMe(m.dmg,m.f);break;
    case 'prop+':createPropView(m);break;
    case 'pstick':{const q=props.get(m.id);if(q){q.face=m.f|0;q.stuck=true;q.tpos.set(m.x,m.y,m.z);}break;}
    case 'prop-':removeProp(m.id,false);break;
    case 'skinimg':{const q=players.get(m.id);if(q)applySkinData(q,typeof m.d==='string'?m.d:'');break;}
    case 'shot':case 'tshot':case 'boom':case 'dead':case 'skin':case 'nk':case 'drn':case 'dpos':case 'bomb':case 'msl':case 'mend':onEvent(m);break;
    case 'v+':createVeh(m);break;
    case 'v-':removeVeh(m.id,false);break;
    case 'vs':{const v=vehs.get(m.id);if(v)setSeats(v,m.s);break;}
    case 'vdeny':me.vcd[m.k]=G.time+m.s;toast((m.k==='car'?'Car':'Tank / heli')+' ready in '+Math.ceil(m.s)+'s');break;
    case 'stop':leaveToMenu('Host stopped the lobby.');break;
  }
}
function netTick(dt){
  G.netAcc+=dt;if(G.netAcc<1/15)return;G.netAcc=0;
  if(droneFlying()){const d=me.dr;fireEvent({t:'dpos',x:r2(d.pos.x),y:r2(d.pos.y),z:r2(d.pos.z),yaw:r2(d.yaw)});}

function updateFX(dt){

  fxs.parts=fxs.parts.filter(t=>{

    t.vel.y-=(t.g===undefined?20:t.g)*dt;t.mesh.position.addScaledVector(t.vel,dt);if(t.grow)t.mesh.scale.addScalar(t.grow*dt);

function doBoom(m){
  const c=new V3(m.x,m.y,m.z);
  flashSphere(c,m.r);
  burst(c,[0xffb02e,0xff5a1f,0x555555],28,9);
  sfxAt('boom',c);
  if(G.vault&&!G.vault.broken){const v=G.vault,dv=Math.hypot(c.x-v.cx,c.y-v.cy,c.z-v.cz);if(dv<m.r+2&&m.dmg)vaultDmg(m.dmg*1.6*(1-dv/(m.r+2)));}
  if(G.net.role==='host'&&G.npcs.length)npcHear(c,1.4);
  const cen=new V3(me.pos.x,me.pos.y+.9,me.pos.z),d=cen.distanceTo(c);
  if(me.alive&&d<m.r&&!(m.vk!==undefined&&me.veh&&me.veh.id===m.vk)){
    const f=1-d/m.r,dir=cen.clone().sub(c).normalize();
    me.vel.addScaledVector(dir,f*16);me.vel.y+=f*6;me.onGround=false;

  if(G.net.role==='host'){
    for(const v of [...vehs.values()]){
      if(m.vk===v.id)continue;
      const dv=Math.hypot(v.pos.x-c.x,v.pos.y+v.K.h/2-c.y,v.pos.z-c.z);
      if(m.dmg&&dv<m.r+2)applyVehDmg(v.id,m.dmg*(1-dv/(m.r+2))*v.K.expl,m.f);
    }
    for(const n of G.npcs){
      if(n.st===3)continue;
      const dn=Math.hypot(n.pos.x-c.x,n.pos.y+.9-c.y,n.pos.z-c.z);
      if(m.dmg&&dn<m.r)hitNpc(n.id,m.kill?9999:m.dmg*1.3*(1-dn/m.r),m.f);
    }
    for(const p of props.values()){
      const d2=p.pos.distanceTo(c);
      if(d2<m.r*1.4){
        const f=1-d2/(m.r*1.4),dir=p.pos.clone().sub(c).normalize();
        if(!p.stuck){p.vel.addScaledVector(dir,f*22/p.m);p.vel.y+=f*7/p.m;p.spin=(Math.random()-.5)*14;p.sleep=0;}
        if(p.fuse!==undefined&&d2<m.r*.8)p.fuse=Math.min(p.fuse,G.time+.12+Math.random()*.2);
        if(p.item.remote&&p.fuse===undefined&&d2<m.r*.7)p.fuse=G.time+.12+Math.random()*.25;
      }
    }
  }
}

/* ================= collision, ray casting ================= */
function overlapsPlayer(c,y){
  return me.pos.x+PW>c.x0&&me.pos.x-PW<c.x1&&me.pos.z+PW>c.z0&&me.pos.z-PW<c.z1&&y+PH>c.y0&&y<c.y1;
}
function resolveHoriz(axis){
  for(const c of G.colliders){
    if(!overlapsPlayer(c,me.pos.y))continue;
    if(c.y1-me.pos.y<=STEP){me.pos.y=c.y1;if(me.vel.y<0)me.vel.y=0;me.onGround=true;continue;}
    if(axis==='x'){
      if(me.vel.x>0||me.pos.x<(c.x0+c.x1)/2)me.pos.x=c.x0-PW-.001;else me.pos.x=c.x1+PW+.001;
      me.vel.x=0;
    }else{
      if(me.vel.z>0||me.pos.z<(c.z0+c.z1)/2)me.pos.z=c.z0-PW-.001;else me.pos.z=c.z1+PW+.001;
      me.vel.z=0;
    }
  }
}
function resolveProps(){
  const fist=me.inv[me.slot]===FIST;
  for(const p of props.values()){
    const hx=p.half[0],hy=p.half[1],hz=p.half[2],top=p.pos.y+hy,bot=p.pos.y-hy;
    if(me.pos.x+PW<=p.pos.x-hx||me.pos.x-PW>=p.pos.x+hx||me.pos.z+PW<=p.pos.z-hz||me.pos.z-PW>=p.pos.z+hz)continue;
    if(me.pos.y>=top||me.pos.y+PH<=bot)continue;
    if(me.vel.y<=0&&(me.py0>=top-.1||top-me.pos.y<=STEP)){me.pos.y=top;me.vel.y=0;me.onGround=true;continue;}
    if(fist||me.vel.y>0)continue;
    const dx=me.pos.x-p.pos.x,dz=me.pos.z-p.pos.z,ox=PW+hx-Math.abs(dx),oz=PW+hz-Math.abs(dz);
    if(ox<oz){me.pos.x+=(dx>=0?1:-1)*ox;me.vel.x=0;}else{me.pos.z+=(dz>=0?1:-1)*oz;me.vel.z=0;}
  }
}
function resolveVert(){
  for(const c of G.colliders){
    if(!overlapsPlayer(c,me.pos.y))continue;
    if(me.vel.y<=0){me.pos.y=c.y1;me.vel.y=0;me.onGround=true;}
    else{me.pos.y=c.y0-PH-.001;me.vel.y=0;}
  }
}
function rayBox(ox,oy,oz,dx,dy,dz,x0,y0,z0,x1,y1,z1){
  let tmin=0,tmax=1e9;
  const o=[ox,oy,oz],d=[dx,dy,dz],lo=[x0,y0,z0],hi=[x1,y1,z1];
  for(let i=0;i<3;i++){
    if(Math.abs(d[i])<1e-9){if(o[i]<lo[i]||o[i]>hi[i])return -1;}
    else{
      let t1=(lo[i]-o[i])/d[i],t2=(hi[i]-o[i])/d[i];
      if(t1>t2){const s=t1;t1=t2;t2=s;}
      if(t1>tmin)tmin=t1;if(t2<tmax)tmax=t2;
      if(tmin>tmax)return -1;
    }
  }
  return tmin;
}
const UPV=new V3(0,1,0);
const FACEN=[null,new V3(0,1,0),new V3(0,-1,0),new V3(1,0,0),new V3(-1,0,0),new V3(0,0,1),new V3(0,0,-1)];
function hitFace(h,px,py,pz){
  if(h.nf)return 1;
  const c=h.c;if(!c)return 0;
  const d=[Math.abs(px-c.x1),Math.abs(px-c.x0),Math.abs(py-c.y1),Math.abs(py-c.y0),Math.abs(pz-c.z1),Math.abs(pz-c.z0)];
  let k=0;for(let i=1;i<6;i++)if(d[i]<d[k])k=i;
  return [3,4,1,2,5,6][k];
}
function stickProp(p,c,face){
  const o=p.half[1]+.005;
  if(face===3)p.pos.x=c.x1+o;else if(face===4)p.pos.x=c.x0-o;else if(face===1)p.pos.y=c.y1+o;else if(face===2)p.pos.y=c.y0-o;else if(face===5)p.pos.z=c.z1+o;else p.pos.z=c.z0-o;
  p.face=face;p.stuck=true;p.vel.set(0,0,0);p.sleep=2;p.spin=0;
  bc({t:'pstick',id:p.id,f:face,x:r2(p.pos.x),y:r2(p.pos.y),z:r2(p.pos.z)});
}
function castRay(ox,oy,oz,dx,dy,dz,maxT){
  let best={t:maxT,type:null};
  if(dy<-1e-6){const t=-oy/dy;if(t>0&&t<best.t)best={t,type:'world',nf:1};}
  if(TR.any){const t=trT(ox,oy,oz,dx,dy,dz,best.t,false);if(t>=0&&t<best.t)best={t,type:'world',nf:1};}
  for(const c of G.colliders){const t=rayBox(ox,oy,oz,dx,dy,dz,c.x0,c.y0,c.z0,c.x1,c.y1,c.z1);if(t>=0&&t<best.t)best={t,type:'world',c};}
  for(const p of players.values()){
    if(!p.alive||riding(p.id))continue;
    const t=rayBox(ox,oy,oz,dx,dy,dz,p.pos.x-.35,p.pos.y,p.pos.z-.35,p.pos.x+.35,p.pos.y+1.8,p.pos.z+.35);
    if(t>=0&&t<best.t)best={t,type:'player',id:p.id};
  }
  for(const p of props.values()){
    const h=p.half,t=rayBox(ox,oy,oz,dx,dy,dz,p.pos.x-h[0],p.pos.y-h[1],p.pos.z-h[2],p.pos.x+h[0],p.pos.y+h[1],p.pos.z+h[2]);
    if(t>=0&&t<best.t)best={t,type:'prop',id:p.id};
  }
  for(const n of G.npcs){if(n.st===3)continue;const t=rayBox(ox,oy,oz,dx,dy,dz,n.pos.x-.35,n.pos.y,n.pos.z-.35,n.pos.x+.35,n.pos.y+(n.st===2?1.2:1.8),n.pos.z+.35);if(t>=0&&t<best.t)best={t,type:'npc',id:n.id};}
  for(const v of vehs.values()){
    if(v.id===G.rayIgnore)continue;
    const s=Math.abs(Math.sin(v.yaw)),k=Math.abs(Math.cos(v.yaw)),hx=s*v.K.hz+k*v.K.hx,hz=k*v.K.hz+s*v.K.hx;
    const t=rayBox(ox,oy,oz,dx,dy,dz,v.pos.x-hx,v.pos.y,v.pos.z-hz,v.pos.x+hx,v.pos.y+v.K.h,v.pos.z+hz);
    if(t>=0&&t<best.t)best={t,type:'veh',id:v.id};
  }
  for(const c of G.cars){
    const L=c.hl||2.1,W=c.hw||1.05,s=Math.abs(Math.sin(c.yaw)),k=Math.abs(Math.cos(c.yaw)),hx=s*L+k*W,hz=k*L+s*W,cy=c.y||0;
    const t=rayBox(ox,oy,oz,dx,dy,dz,c.pos.x-hx,cy,c.pos.z-hz,c.pos.x+hx,cy+(c.hh||1.5),c.pos.z+hz);
    if(t>=0&&t<best.t)best={t,type:'world'};
  }
  return best;
}

/* ================= local player ================= */
function aim(){
  const cp=Math.cos(me.pitch);

function curItem(){return ITEMS[me.inv[me.slot]]||null;}
function updateLocal(dt){
  if(!me.alive){
    me.respawn-=dt;
    $('deadSub').textContent='Respawning in '+Math.max(1,Math.ceil(me.respawn));
    if(me.respawn<=0)respawnMe();
    return;
  }
  const act0=(G.locked&&!G.pane||sideOpen())&&!(CRE()&&CR.busy),dro=droneFlying(),act=act0&&!dro;
  if(dro)droneFly(dt,act0);
  if(me.car){driveCar(dt,act);return;}
  if(me.veh){driveVeh(dt,act);return;}
  if(EDIT()){creativeMove(dt,act);return;}
  let ix=0,iz=0;
  if(act){if(keys.KeyW)iz+=1;if(keys.KeyS)iz-=1;if(keys.KeyD)ix+=1;if(keys.KeyA)ix-=1;}
  const len=Math.hypot(ix,iz)||1;ix/=len;iz/=len;
  const cr=act&&keys.KeyC;me.crouch=lerp(me.crouch,cr?1:0,Math.min(1,dt*12));
  const hi=curItem(),spd=(act&&!cr&&(keys.ShiftLeft||keys.ShiftRight)?8.6:5.6)*(1-.45*me.crouch)*(hi&&hi.id==='minigun'?(me.spin>.1?.55:.78):1);
  const s=Math.sin(me.yaw),c=Math.cos(me.yaw);
  const wx=c*ix-s*iz,wz=-s*ix-c*iz;
  const a=Math.min(1,(me.onGround?14:3)*dt);
  me.vel.x+=(wx*spd-me.vel.x)*a;me.vel.z+=(wz*spd-me.vel.z)*a;
  if(act&&keys.Space&&me.onGround){me.vel.y=9;me.onGround=false;sfx('jump');}
  me.vel.y=Math.max(-40,me.vel.y-26*dt);
  me.onGround=false;me.py0=me.pos.y;
  const tox=me.pos.x,toz=me.pos.z;me.pos.x+=me.vel.x*dt;resolveHoriz('x');
  me.pos.z+=me.vel.z*dt;resolveHoriz('z');
  me.pos.y+=me.vel.y*dt;resolveVert();resolveProps();
  {const fl=trGround(tox,toz);if(me.pos.y<fl){me.pos.y=fl;if(me.vel.y<0)me.vel.y=0;me.onGround=true;}}
  me.pos.x=clamp(me.pos.x,-LIM,LIM);me.pos.z=clamp(me.pos.z,-LIM,LIM);
  let nearC=null,nd=1e9;
  for(const c of G.cars){const dx=me.pos.x-c.pos.x,dz=me.pos.z-c.pos.z,d=Math.hypot(dx,dz);
    if(c.po){
      if(c.drv>=0&&me.pos.y<(c.y||0)+c.hh&&me.pos.y+PH>(c.y||0)){
        const cs=Math.cos(c.yaw),sn=Math.sin(c.yaw);
        let lx=dx*cs-dz*sn,lz=dx*sn+dz*cs;const ox=c.hw+PW-Math.abs(lx),oz=c.hl+PW-Math.abs(lz);
        if(ox>0&&oz>0){if(ox<oz)lx+=(lx>=0?1:-1)*ox;else lz+=(lz>=0?1:-1)*oz;me.pos.x=c.pos.x+cs*lx+sn*lz;me.pos.z=c.pos.z-sn*lx+cs*lz;}
      }
    }else if(d<1.95&&me.pos.y<1.2&&d>.001){me.pos.x=c.pos.x+dx/d*1.95;me.pos.z=c.pos.z+dz/d*1.95;}
    if(c.drv<0&&d<(c.reach||3.4)&&d<nd){nd=d;nearC=c;}}
  me.nearCar=nearC;me.ncd=nearC?nd:1e9;
  let nearV=null,nvd=1e9;
  for(const v of vehs.values()){
    const K=v.K,dx=me.pos.x-v.pos.x,dz=me.pos.z-v.pos.z,cs=Math.cos(v.yaw),sn=Math.sin(v.yaw);
    if(me.pos.y<v.pos.y+K.h-.2&&me.pos.y+PH>v.pos.y){
      let lx=dx*cs-dz*sn,lz=dx*sn+dz*cs;const ox=K.hx+PW-Math.abs(lx),oz=K.hz+PW-Math.abs(lz);
      if(ox>0&&oz>0){if(ox<oz)lx+=(lx>=0?1:-1)*ox;else lz+=(lz>=0?1:-1)*oz;me.pos.x=v.pos.x+cs*lx+sn*lz;me.pos.z=v.pos.z-sn*lx+cs*lz;}
    }
    const d=Math.hypot(me.pos.x-v.pos.x,me.pos.z-v.pos.z);
    if(v.seats.indexOf(-1)>=0&&d<K.reach&&Math.abs(me.pos.y-v.pos.y)<4&&d<nvd){nvd=d;nearV=v;}
  }
  me.nearVeh=nearV;me.nvd=nearV?nvd:1e9;
  if(!!nearV!==!!G.vehHint){G.vehHint=!!nearV;if(nearV)showHint('Press E to ride the '+nearV.K.n,2.5);}
  if(!!nearC!==!!G.carHint){G.carHint=!!nearC;if(nearC)showHint('Press E to drive',2.5);}
  const hs=Math.hypot(me.vel.x,me.vel.z);
  me.phase+=hs*dt*1.8;me.bob+=hs*dt*1.7;
}

/* shared ground-vehicle movement + collision: sub-stepped, slides along surfaces, small bounce head-on */
function bumpMove(b,dt,cir,gy0){
  const nsub=Math.max(1,Math.min(6,Math.ceil(Math.abs(b.sp)*dt/.35))),hdt=dt/nsub;
  for(let ss=0;ss<nsub;ss++){
    b.pos.x+=-Math.sin(b.yaw)*b.sp*hdt;b.pos.z+=-Math.cos(b.yaw)*b.sp*hdt;
    for(let pass=0;pass<2;pass++){
      let hit=false;
      for(const w of G.colliders){
        if(w.y0>1.4+gy0||w.y1<gy0+.05)continue;
        for(const[off,R]of cir){
          const fx=-Math.sin(b.yaw),fz=-Math.cos(b.yaw);
          const px=b.pos.x+fx*off,pz=b.pos.z+fz*off;
          if(px<w.x0-R||px>w.x1+R||pz<w.z0-R||pz>w.z1+R)continue;
          const nx0=clamp(px,w.x0,w.x1),nz0=clamp(pz,w.z0,w.z1);
          let dx=px-nx0,dz=pz-nz0,d=Math.hypot(dx,dz),pen,nx,nz;
          if(d>1e-4){if(d>=R)continue;nx=dx/d;nz=dz/d;pen=R-d;}
          else{const l=px-w.x0,r=w.x1-px,b2=pz-w.z0,t=w.z1-pz,m=Math.min(l,r,b2,t);
            if(m===l){nx=-1;nz=0;}else if(m===r){nx=1;nz=0;}else if(m===b2){nx=0;nz=-1;}else{nx=0;nz=1;}pen=m+R;}
          b.pos.x+=nx*pen;b.pos.z+=nz*pen;hit=true;
          const fn=fx*nx+fz*nz;
          if(b.sp*fn<0){
            b.sp*=1-1.22*fn*fn;if(Math.abs(b.sp)<.4)b.sp=0;
            if(off!==0&&Math.abs(b.sp)>1)b.yaw+=clamp(pen*(-Math.cos(b.yaw)*nx+Math.sin(b.yaw)*nz)*off*.18,-.06,.06);
          }
        }
      }
      if(!hit)break;
    }
  }
}
/* terrain: ground height under a point, and the pitch/roll that lets a long vehicle sit on a slope */
function propGY(x,z){return TR.any?trH(x,z):0;}
function terrainTilt(x,z,yaw,L,W){
  const sn=Math.sin(yaw),cs=Math.cos(yaw);
  if(!TR.any)return{p:0,r:0,y:0};
  const fx=-sn,fz=-cs,rx=cs,rz=-sn;
  const hf=trH(x+fx*L,z+fz*L),hb=trH(x-fx*L,z-fz*L),hR=trH(x+rx*W,z+rz*W),hL=trH(x-rx*W,z-rz*W);
  return{p:clamp(Math.atan2(hf-hb,2*L),-.5,.5),r:clamp(Math.atan2(hR-hL,2*W),-.4,.4),y:(hf+hb+hR+hL)/4};
}
function settleCarY(c,dt){
  const gy=propGY(c.pos.x,c.pos.z);
  if(c.y>gy+.01){c.vy=(c.vy||0)-26*dt;c.y=Math.max(gy,c.y+c.vy*dt);if(c.y<=gy)c.vy=0;}
  else{c.vy=0;c.y+=(gy-c.y)*Math.min(1,dt*16);}
}
function driveCar(dt,act){
  const c=me.car;let th=0,st=0;
  if(act){if(keys.KeyW)th+=1;if(keys.KeyS)th-=1;if(keys.KeyA)st+=1;if(keys.KeyD)st-=1;}
  if(th>0)c.sp+=(c.sp<0?26:13)*th*dt;else if(th<0)c.sp+=(c.sp>0?26:9)*th*dt;
  c.sp*=Math.exp(-(act&&keys.Space?3.2:.5)*dt);
  c.sp=clamp(c.sp,-7,c.vmax||19);
  c.yaw+=st*dt*(c.turn||1.7)*clamp(c.sp/4,-1,1);
  bumpMove(c,dt,c.circ||[[0,1.5]],c.po?c.y:0);
  c.pos.x=clamp(c.pos.x,-LIM,LIM);c.pos.z=clamp(c.pos.z,-LIM,LIM);
  if(c.po)settleCarY(c,dt);else c.y=0;
  me.pos.set(c.pos.x,c.y,c.pos.z);me.yaw=c.yaw;me.pitch=-.2;
  for(const p of players.values()){
    if(!p.alive||Math.abs(c.sp)<6)continue;
    if(carNear(c,p.pos.x,p.pos.z,0)&&(!c.hc[p.id]||G.time-c.hc[p.id]>.8)){c.hc[p.id]=G.time;sendHit(p.id,Math.min(70,Math.round(Math.abs(c.sp)*3.5)),me.id);}
  }
  if(Math.abs(c.sp)>=5)for(const n of G.npcs){if(n.st===3)continue;const k='n'+n.id;if(carNear(c,n.pos.x,n.pos.z,0)&&(!c.hc[k]||G.time-c.hc[k]>.8)){c.hc[k]=G.time;sendNpcHit(n.id,Math.min(80,Math.round(Math.abs(c.sp)*6)));}}
}

const carById=id=>{for(const c of G.cars)if(c.id===id)return c;return null;};
const CAR_SPEC={car:{v:19,t:1.7},sports:{v:25,t:1.8},pickup:{v:18,t:1.6},van:{v:16,t:1.45},bus:{v:13,t:1.1}};
const _EUL=new THREE.Euler();
function carNear(c,x,z,m){
  if(!c.po)return Math.hypot(x-c.pos.x,z-c.pos.z)<2+m;
  const cs=Math.cos(c.yaw),sn=Math.sin(c.yaw),dx=x-c.pos.x,dz=z-c.pos.z;
  return Math.abs(dx*cs-dz*sn)<c.hw+.6+m&&Math.abs(dx*sn+dz*cs)<c.hl+.4+m;
}
function crSyncCars(){
  if(!(G.mapId==='creative'&&G.cplay))return;
  const have=new Set();
  for(let i=G.cars.length-1;i>=0;i--){
    const c=G.cars[i];if(!c.po)continue;
    if(c.po.dead||CR.byId.get(c.po.id)!==c.po){if(me.car===c)me.car=null;G.cars.splice(i,1);}
    else have.add(c.po);
  }
  for(const o of CR.objs){
    if(o.type!=='prop'||o.dead||have.has(o))continue;
    const pd=PROPD[o.kind];if(!pd||pd.g!=='veh')continue;
    let x0=1e9,x1=-1e9,z1=0,y1=0;
    for(const q of pd.parts){x0=Math.min(x0,q[0]-q[3]/2);x1=Math.max(x1,q[0]+q[3]/2);z1=Math.max(z1,Math.abs(q[2])+q[5]/2);y1=Math.max(y1,q[1]+q[4]/2);}
    const hl=o.size.x/2,hw=o.size.z/2,hh=o.size.y; /* o.size is the real size in metres; o.pos is the centre of the box */
    const f=new V3(1,0,0).applyQuaternion(o.quat),yaw=Math.atan2(-f.z,f.x)-Math.PI/2;
    const sp=CAR_SPEC[o.kind]||CAR_SPEC.car;
    const len=Math.max(0,hl-hw),n=Math.max(1,Math.ceil(len/Math.max(.3,hw))+1),circ=[];
    for(let i=0;i<n;i++)circ.push([n>1?-len+2*len*i/(n-1):0,hw+.15]);
    G.cars.push({id:100000+o.id,po:o,pos:new V3(o.pos.x,0,o.pos.z),tpos:new V3(o.pos.x,0,o.pos.z),yaw,tyaw:yaw,sp:0,drv:-1,mesh:o.mesh,hc:{},
      hl,hw,hh,y:o.pos.y-o.size.y/2,pt:0,rl:0,vy:0,reach:hl+1.8,exitD:hw+1.5,vmax:sp.v,turn:sp.t,circ,was:false});
  }
}
function updatePropCar(c,dt){
  const o=c.po,act=c.drv>=0;
  if(act||c.was){
    if(c!==me.car)settleCarY(c,dt);
    const T=terrainTilt(c.pos.x,c.pos.z,c.yaw,Math.max(.5,c.hl*.8),Math.max(.4,c.hw*.9)),k=Math.min(1,dt*10);
    c.pt=lerp(c.pt,T.p,k);c.rl=lerp(c.rl,T.r,k);
    o.pos.set(c.pos.x,c.y+c.hh/2+.02,c.pos.z);
    o.quat.setFromEuler(_EUL.set(-c.rl,c.yaw+Math.PI/2,c.pt,'YZX'));
    o.mesh.position.copy(o.pos);o.mesh.quaternion.copy(o.quat);o.mesh.scale.copy(o.size);o.mesh.updateMatrix();
  }
  if(act!==c.was){
    c.was=act;crBB(o);
    crSyncCols(o,act?[]:(o.collide?crPropPieces(o).map(P=>crPieceBox(o,P)):[]));
  }
}
function updateCars(dt){
  if(G.cplay)crSyncCars();
  for(const c of G.cars){
    if(c!==me.car){
      c.pos.lerp(c.tpos,Math.min(1,dt*10));
      let dy=c.tyaw-c.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));c.yaw+=dy*Math.min(1,dt*10);
    }
    if(c.po){updatePropCar(c,dt);continue;}
    c.mesh.position.set(c.pos.x,0,c.pos.z);c.mesh.rotation.y=c.yaw;
  }
}

  pickup:{n:'PICKUP TRUCK',hp:190,seats:1,hx:1.1,hz:2.4,h:1.8,reach:4.1,armor:.9,expl:2,R:1.7,cls:'car',vmax:18,acc:12,turn:1.6},
  van:{n:'VAN',hp:220,seats:1,hx:1.1,hz:2.45,h:2.35,reach:4.2,armor:.85,expl:2.1,R:1.8,cls:'car',vmax:16,acc:11,turn:1.45},
  bus:{n:'BUS',hp:380,seats:1,hx:1.4,hz:4.55,h:3.3,reach:6.3,armor:.7,expl:2.3,R:2.8,cls:'car',vmax:13,acc:9,turn:1.1},

const isCar=k=>!!(VK[k]&&VK[k].cls==='car');
for(const k in VK){const K=VK[k];if(K.cls!=='car')continue;
  const hw=K.hx-.05,len=Math.max(0,K.hz-hw),n=Math.max(1,Math.ceil(len/hw)+1);K.circ=[];
  for(let i=0;i<n;i++)K.circ.push([n>1?-len+2*len*i/(n-1):0,hw+.1]);}
const BIG_CD=60,CAR_CD=3;
const angLerp=(a,b,t)=>{let d=b-a;d=Math.atan2(Math.sin(d),Math.cos(d));return a+d*t;};
const SEATS=[[-1.56,.26,-.65],[1.56,.26,-.65],[-1.56,.26,1.0],[1.56,.26,1.0]];
function seatWorld(v,i,out){
  const o=SEATS[i-1],cs=Math.cos(v.yaw),sn=Math.sin(v.yaw);
  return out.set(v.pos.x+cs*o[0]+sn*o[2],v.pos.y+o[1],v.pos.z-sn*o[0]+cs*o[2]);
}
function passSeat(id){
  for(const v of vehs.values()){if(v.kind!=='heli')continue;const i=v.seats.indexOf(id);if(i>0)return{v,i};}
  return null;
}
function isGunner(){return !!(me.veh&&me.veh.kind==='heli'&&me.seat>0);}
function riding(id){for(const v of vehs.values())if(v.seats.indexOf(id)>=0)return true;return false;}
function createVeh(d){
  if(vehs.has(d.id))return vehs.get(d.id);
  const K=VK[d.kind];if(!K)return null;
  const col=COLORS[clamp(d.col|0,0,COLORS.length-1)].c;
  const mesh=isCar(d.kind)&&d.kind!=='car'?makePropVeh(d.kind,col):d.kind==='tank'?makeTank(col):d.kind==='heli'?makeHeli(col):d.kind==='b2'?makeB2(col):makeCar(col);
  G.scene.add(mesh);
  const y=d.y||0;
  const v={id:d.id,kind:d.kind,K,owner:d.owner,col:d.col|0,pos:new V3(d.x,y,d.z),tpos:new V3(d.x,y,d.z),lpos:new V3(d.x,y,d.z),yaw:d.yaw||0,tyaw:d.yaw||0,aux:0,taux:0,tu:d.yaw||0,ttu:d.yaw||0,hp:K.hp,seats:new Array(K.seats).fill(-1),mesh,sp:0,vy:0,hc:{},spin:0,rot:0,rec:0,mv:0,vv:new V3()};

function removeVeh(id,announce){
  const v=vehs.get(id);if(!v)return;
  if(me.veh===v)leaveVehLocal(v);
  G.scene.remove(v.mesh);v.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose();});
  vehs.delete(id);
  for(const p of props.values())p.sleep=0;
  if(announce)bc({t:'v-',id});
}
function leaveVehLocal(v){
  me.veh=null;me.seat=-1;
  const d=v.K.hx+1.4;
  me.pos.set(v.pos.x-Math.cos(v.yaw)*d,Math.max(0,v.pos.y),v.pos.z+Math.sin(v.yaw)*d);
  me.vel.set(0,0,0);me.onGround=false;me.pitch=0;
}
function beginRide(v){
  me.veh=v;me.seat=v.seats.indexOf(me.id);me.vel.set(0,0,0);v.sp=0;
  if(isCar(v.kind)){me.yaw=v.yaw;me.pitch=-.2;}
  if(v.kind==='b2'){me.yaw=v.yaw;me.pitch=-.18;}
  if(v.kind==='heli'&&me.seat>0){me.yaw=v.yaw+(SEATS[me.seat-1][0]<0?1:-1)*Math.PI/2;me.pitch=0;me.crouch=0;}
  toast(v.kind==='b2'?'B-2: W/S speed · A/D turn · SPACE climb · SHIFT/C dive · CLICK drops bomb (10s) · E exit':v.kind==='tank'?'W/S drive · A/D turn · mouse aims · CLICK fires · E exit':v.kind==='heli'?(me.seat===0?'PILOT: W/S fly · A/D turn · SPACE up · SHIFT/C down · CLICK fires nose gun · E exit':'GUNNER seat '+me.seat+' of 4 · shoot / throw from the side · E to jump off'):'W/S gas · A/D steer · SPACE brake · E exit');
  mouse.l=mouse.r=false;
}
function setSeats(v,s){
  const prev=me.veh===v?v.seats.indexOf(me.id):-2;
  v.seats=s.slice();
  const i=v.seats.indexOf(me.id);
  if(i>=0&&!me.veh&&!me.car&&me.alive)beginRide(v);
  else if(i<0&&me.veh===v)leaveVehLocal(v);
  else if(i===0&&prev>0&&me.veh===v)toast('You are the pilot now');
  if(me.veh===v)me.seat=i;
}
function hostSeat(v,pid){
  if(v.seats.indexOf(pid)>=0)return;
  const s=v.seats.indexOf(-1);if(s<0)return;
  v.seats[s]=pid;bc({t:'vs',id:v.id,s:v.seats});
  if(pid===me.id)setSeats(v,v.seats);
}
function hostUnseat(v,pid){
  const i=v.seats.indexOf(pid);if(i<0)return;
  v.seats[i]=-1;
  if(i===0)for(let j=1;j<v.seats.length;j++)if(v.seats[j]>=0){v.seats[0]=v.seats[j];v.seats[j]=-1;break;}
  bc({t:'vs',id:v.id,s:v.seats});
  if(me.veh===v&&v.seats[0]===me.id)toast('You are the pilot now');
}
function enterVeh(v){

function exitVeh(){

/* spawning: tank + heli share one 60s timer and you can own one of them at a time; cars have their own slot */
function vehClear(x,z,K){
  for(const c of G.colliders){
    if(c.y0>1.8||c.y1<.3)continue;
    const nx=clamp(x,c.x0,c.x1),nz=clamp(z,c.z0,c.z1);
    if(Math.hypot(x-nx,z-nz)<K.R+.6)return false;
  }
  return true;
}
function hostSpawnVeh(kind,owner){
  const K=VK[kind];if(!K)return false;
  const key=isCar(kind)?'car':'big';
  const st=G.vcd[owner]||(G.vcd[owner]={car:0,big:0});
  if(G.time<st[key]){
    const rem=st[key]-G.time;
    if(owner===me.id)toast((isCar(kind)?'Car':'Tank / heli')+' ready in '+Math.ceil(rem)+'s');
    else{const c=G.conns.get(owner);if(c&&c.open)c.send({t:'vdeny',k:key,s:r2(rem)});}
    return false;
  }
  let pos,yaw,col;
  if(owner===me.id){if(!me.alive||me.veh||me.car)return false;pos=me.pos;yaw=me.yaw;col=me.color;}
  else{const p=players.get(owner);if(!p||!p.alive||riding(owner))return false;pos=p.pos;yaw=p.tyaw;col=p.color;}
  for(const v of [...vehs.values()])if(v.owner===owner&&(isCar(kind)===isCar(v.kind)))removeVeh(v.id,true);
  const dist=isCar(kind)?4.5+Math.max(0,K.hz-2.2):kind==='tank'?7:kind==='b2'?13:8;
  let x=pos.x-Math.sin(yaw)*dist,z=pos.z-Math.cos(yaw)*dist,found=false;
  for(const[dd,off]of[[1,0],[1,.7],[1,-.7],[1.7,0],[.6,0],[1.4,1.4],[1.4,-1.4]]){
    const tx=clamp(pos.x-Math.sin(yaw+off)*dist*dd,-HALF+4,HALF-4),tz=clamp(pos.z-Math.cos(yaw+off)*dist*dd,-HALF+4,HALF-4);
    if(vehClear(tx,tz,K)){x=tx;z=tz;found=true;break;}
  }
  if(!found){x=clamp(x,-HALF+4,HALF-4);z=clamp(z,-HALF+4,HALF-4);}
  const id=++G.vseq;
  createVeh({id,kind,x,y:0,z,yaw,owner,col});
  bc({t:'v+',id,kind,x:r2(x),y:0,z:r2(z),yaw:r2(yaw),owner,col});
  st[key]=G.time+(isCar(kind)?CAR_CD:BIG_CD);
  return true;
}
function vehRequest(kind){
  if(kind==='drone')return spawnDrone();
  if(!me.alive)return false;
  if(me.veh||me.car){toast('Get out of your vehicle first');return false;}
  const key=isCar(kind)?'car':'big',cd=isCar(kind)?CAR_CD:BIG_CD;
  if(G.time<me.vcd[key]){toast((isCar(kind)?'Car':'Tank / heli')+' ready in '+Math.ceil(me.vcd[key]-G.time)+'s');return false;}
  if(G.net.role==='host'){if(hostSpawnVeh(kind,me.id)){me.vcd[key]=G.time+cd;sfx('place');return true;}return false;}
  sendHost({t:'vspawn',kind});me.vcd[key]=G.time+cd;sfx('place');return true;
}
/* damage (host decides) */
function sendVehHit(id,dmg){

function applyVehDmg(id,dmg,by){

function destroyVeh(v,by){

function vehBoxes(){
  const a=[];
  for(const v of vehs.values()){
    const s=Math.abs(Math.sin(v.yaw)),k=Math.abs(Math.cos(v.yaw)),hx=s*v.K.hz+k*v.K.hx,hz=k*v.K.hz+s*v.K.hx;
    a.push({x0:v.pos.x-hx,x1:v.pos.x+hx,y0:v.pos.y,y1:v.pos.y+v.K.h,z0:v.pos.z-hz,z1:v.pos.z+hz,mv:v.mv});

/* ================= drone: spawns on your back, J launches it, click or any crash explodes it ================= */
const DRONE_CD=25,DRONE_R=.3,DRONE_SPEED=15;
function droneFlying(){return !!(me.dr&&me.dr.s===2);}
function ensureDrone(){
  if(me.dr)return me.dr;
  const b=makeDrone(COLORS[me.color].c);b.scale.setScalar(.9);b.rotation.x=Math.PI/2;b.position.set(0,1.04,.4);
  me.dr={s:0,back:b,pos:new V3(),vel:new V3(),yaw:0,pitch:0,roll:0,age:0,armed:false};
  return me.dr;
}
function dropBack(d){if(d.back&&d.back.parent)d.back.parent.remove(d.back);}
function spawnDrone(){
  if(!me.alive)return false;
  if(me.veh||me.car){toast('Get out of your vehicle first');return false;}
  if(droneFlying()){toast('Your drone is already in the air');return false;}
  if(G.time<(me.dcd||0)){toast('Drone ready in '+Math.ceil(me.dcd-G.time)+'s');return false;}
  const d=ensureDrone();
  d.s=1;me.dcd=G.time+DRONE_CD;
  fireEvent({t:'drn',s:1});
  sfx('place');
  showHint('Drone strapped to your back · press J to launch it',5);
  return true;
}
/* does a drone-sized sphere at (x,y,z) touch anything solid? */
function droneBlocked(x,y,z){
  const R=DRONE_R;
  if(y-R<=0.02)return true;
  for(const c of G.colliders){
    const nx=clamp(x,c.x0,c.x1),ny=clamp(y,c.y0,c.y1),nz=clamp(z,c.z0,c.z1);
    const dx=x-nx,dy=y-ny,dz=z-nz;
    if(dx*dx+dy*dy+dz*dz<R*R)return true;
  }
  for(const q of props.values()){
    const h=q.half,nx=clamp(x,q.pos.x-h[0],q.pos.x+h[0]),ny=clamp(y,q.pos.y-h[1],q.pos.y+h[1]),nz=clamp(z,q.pos.z-h[2],q.pos.z+h[2]);
    const dx=x-nx,dy=y-ny,dz=z-nz;
    if(dx*dx+dy*dy+dz*dz<R*R)return true;
  }
  for(const b of vehBoxes()){
    const nx=clamp(x,b.x0,b.x1),ny=clamp(y,b.y0,b.y1),nz=clamp(z,b.z0,b.z1);
    const dx=x-nx,dy=y-ny,dz=z-nz;
    if(dx*dx+dy*dy+dz*dz<R*R)return true;
  }
  for(const c of G.cars){
    const L=c.hl||2.1,W=c.hw||1.05,sn=Math.abs(Math.sin(c.yaw)),cs=Math.abs(Math.cos(c.yaw)),hx=sn*L+cs*W,hz=cs*L+sn*W,cy=c.y||0;
    const nx=clamp(x,c.pos.x-hx,c.pos.x+hx),ny=clamp(y,cy,cy+(c.hh||1.5)),nz=clamp(z,c.pos.z-hz,c.pos.z+hz);
    const dx=x-nx,dy=y-ny,dz=z-nz;
    if(dx*dx+dy*dy+dz*dz<R*R)return true;
  }
  for(const p of players.values()){
    if(!p.alive)continue;
    const nx=clamp(x,p.pos.x-.4,p.pos.x+.4),ny=clamp(y,p.pos.y,p.pos.y+1.9),nz=clamp(z,p.pos.z-.4,p.pos.z+.4);
    const dx=x-nx,dy=y-ny,dz=z-nz;
    if(dx*dx+dy*dy+dz*dz<R*R)return true;
  }
  for(const n of G.npcs){
    if(n.st===3)continue;
    const nx=clamp(x,n.pos.x-.4,n.pos.x+.4),ny=clamp(y,n.pos.y,n.pos.y+(n.st===2?1.2:1.9)),nz=clamp(z,n.pos.z-.4,n.pos.z+.4);
    const dx=x-nx,dy=y-ny,dz=z-nz;
    if(dx*dx+dy*dy+dz*dz<R*R)return true;
  }
  return false;
}
function droneLaunch(){
  const d=me.dr;
  if(!d||d.s!==1)return;
  if(me.veh||me.car){toast('Get out of your vehicle first');return;}
  const bx=Math.sin(me.yaw),bz=Math.cos(me.yaw);
  const spots=[[bx*.45,1.05,bz*.45],[0,2.0,0],[bx*.3,1.55,bz*.3],[0,1.2,0]];
  let sp=null;
  for(const o of spots){if(!droneBlocked(me.pos.x+o[0],me.pos.y+o[1],me.pos.z+o[2])){sp=o;break;}}
  if(!sp){toast('No room to launch the drone here');return;}
  d.s=2;d.pos.set(me.pos.x+sp[0],me.pos.y+sp[1],me.pos.z+sp[2]);
  d.vel.set(bx*1.5,2.5,bz*1.5);d.yaw=me.yaw;d.pitch=me.pitch;d.roll=0;d.age=0;d.armed=!mouse.l;
  fireEvent({t:'drn',s:2,x:r2(d.pos.x),y:r2(d.pos.y),z:r2(d.pos.z),yaw:r2(d.yaw)});
  sfx('equip');
  showHint('DRONE · WASD fly · SPACE up · SHIFT/C down · mouse look · CLICK explode',6);
}
function droneExplode(){
  const d=me.dr;if(!d||d.s!==2)return;
  const p=d.pos.clone();
  d.s=0;me.dcd=G.time+DRONE_CD;
  mouse.l=false;
  fireEvent({t:'drn',s:0});
  fireEvent({t:'boom',x:r2(p.x),y:r2(p.y),z:r2(p.z),r:6,dmg:60,kill:1});
}
function droneDrop(){
  const d=me.dr;if(!d||d.s===0)return;
  dropBack(d);d.s=0;
  fireEvent({t:'drn',s:0});
}
function droneFly(dt,act){
  const d=me.dr;
  d.age+=dt;
  if(!mouse.l)d.armed=true;
  let f=0,sd=0,u=0;
  if(act){
    if(keys.KeyW)f+=1;if(keys.KeyS)f-=1;if(keys.KeyD)sd+=1;if(keys.KeyA)sd-=1;
    if(keys.Space)u+=1;if(keys.ShiftLeft||keys.ShiftRight||keys.KeyC)u-=1;
  }
  const cp=Math.cos(d.pitch),sy=Math.sin(d.yaw),cy=Math.cos(d.yaw);
  const fx=-sy*cp,fy=Math.sin(d.pitch),fz=-cy*cp,rx=cy,rz=-sy;
  const tx=fx*f*DRONE_SPEED+rx*sd*DRONE_SPEED*.8,ty=fy*f*DRONE_SPEED+u*DRONE_SPEED*.6,tz=fz*f*DRONE_SPEED+rz*sd*DRONE_SPEED*.8;
  const k=Math.min(1,dt*4);
  d.vel.x+=(tx-d.vel.x)*k;d.vel.y+=(ty-d.vel.y)*k;d.vel.z+=(tz-d.vel.z)*k;
  d.roll+=(clamp(-(d.vel.x*rx+d.vel.z*rz)*.014,-.3,.3)-d.roll)*Math.min(1,dt*6);
  const len=d.vel.length()*dt,n=Math.max(1,Math.ceil(len/.2)),sdt=dt/n;
  for(let i=0;i<n;i++){
    d.pos.x+=d.vel.x*sdt;d.pos.y+=d.vel.y*sdt;d.pos.z+=d.vel.z*sdt;
    d.pos.x=clamp(d.pos.x,-LIM,LIM);d.pos.z=clamp(d.pos.z,-LIM,LIM);
    if(d.pos.y>70){d.pos.y=70;if(d.vel.y>0)d.vel.y=0;}
    if(droneBlocked(d.pos.x,d.pos.y,d.pos.z)){droneExplode();return;}
  }
  if(act&&mouse.l&&d.armed&&d.age>.25){droneExplode();return;}
}
/* back-mounted and remote drones: attach, spin and interpolate every frame */
function updateDrones(dt){
  const md=me.dr;
  if(md&&me.mesh){
    if(md.s===1){if(md.back.parent!==me.mesh)me.mesh.add(md.back);md.back.visible=true;}
    else if(md.back.parent)md.back.visible=false;
  }
  for(const p of players.values()){
    const d=p.dr;if(!d)continue;
    if(!p.alive&&d.s)remoteDrone(p,{s:0});
    if(d.s===1){if(d.back.parent!==p.mesh)p.mesh.add(d.back);d.back.visible=true;}
    else if(d.back.parent)d.back.visible=false;
    if(d.s===2&&d.fly){
      d.pos.lerp(d.tpos,Math.min(1,dt*12));
      d.yaw=angLerp(d.yaw,d.tyaw,Math.min(1,dt*12));
      d.fly.position.copy(d.pos);d.fly.rotation.set(.18,d.yaw,0,'YXZ');
      d.rot=(d.rot||0)+dt*60;
      for(const r of d.fly.userData.rotors)r.rotation.y=d.rot;
    }
  }
}
function remoteDrone(p,m){
  if(!p.dr){const b=makeDrone(COLORS[p.color].c);b.scale.setScalar(.9);b.rotation.x=Math.PI/2;b.position.set(0,1.04,.4);p.dr={s:0,back:b,fly:null,pos:new V3(),tpos:new V3(),yaw:0,tyaw:0,rot:0};}
  const d=p.dr;d.s=m.s|0;

    if(!d.fly){d.fly=makeDrone(COLORS[p.color].c);G.scene.add(d.fly);}
    d.pos.set(m.x||0,m.y||0,m.z||0);d.tpos.copy(d.pos);d.yaw=d.tyaw=m.yaw||0;
  }else if(d.fly){G.scene.remove(d.fly);d.fly=null;}
}
function clearRemoteDrone(p){
  if(!p.dr)return;
  if(p.dr.fly)G.scene.remove(p.dr.fly);
  dropBack(p.dr);p.dr=null;
}
/* driving */
function heliFloor(v,r){r=r||1.4;
  let fl=0;
  for(const c of G.colliders){
    if(c.y1>v.pos.y+.7||c.y1<=fl)continue;
    const nx=clamp(v.pos.x,c.x0,c.x1),nz=clamp(v.pos.z,c.z0,c.z1);
    if(Math.hypot(v.pos.x-nx,v.pos.z-nz)<r)fl=c.y1;
  }
  return fl;
}
function groundVeh(v,dt,th,st,brake){
  const K=v.K,car=K.cls==='car';
  const maxF=car?K.vmax:8.5,maxB=car?7:4,ac=car?K.acc:6.5;
  if(th>0)v.sp+=(v.sp<0?ac*2:ac)*th*dt;else if(th<0)v.sp+=(v.sp>0?ac*2:ac*.8)*th*dt;
  v.sp*=Math.exp(-(brake?3.2:car?.5:1.6)*dt);
  v.sp=clamp(v.sp,-maxB,maxF);
  if(car)v.yaw+=st*dt*K.turn*clamp(v.sp/4,-1,1);else v.yaw+=st*dt*.9*(v.sp<-.5?-1:1);
  if(car)bumpMove(v,dt,K.circ,v.pos.y);
  else{
    v.pos.x+=-Math.sin(v.yaw)*v.sp*dt;v.pos.z+=-Math.cos(v.yaw)*v.sp*dt;
    for(const w of G.colliders){
      if(w.y0>1.4)continue;
      if(v.kind==='tank'&&w.y1<=1.1)continue;
      const nx=clamp(v.pos.x,w.x0,w.x1),nz=clamp(v.pos.z,w.z0,w.z1),dx=v.pos.x-nx,dz=v.pos.z-nz,d=Math.hypot(dx,dz);
      if(d<K.R){if(d>1e-4){v.pos.x=nx+dx/d*K.R;v.pos.z=nz+dz/d*K.R;}else v.pos.x+=K.R;v.sp*=.55;}
    }
  }
  if(TR.any)v.pos.y=propGY(v.pos.x,v.pos.z);
}
function flyHeli(v,dt,th,st,up){
  const grounded=v.pos.y<=heliFloor(v)+.06;
  v.yaw+=st*dt*1.4;
  v.sp+=(th*(grounded?4:18)-v.sp)*Math.min(1,dt*(th?1.4:.9));
  v.vy+=(up*8-v.vy)*Math.min(1,dt*2.4);
  v.pos.x+=-Math.sin(v.yaw)*v.sp*dt;v.pos.z+=-Math.cos(v.yaw)*v.sp*dt;
  v.pos.y+=v.vy*dt;
  for(const c of G.colliders){
    if(v.pos.y+2.8<=c.y0||v.pos.y>=c.y1-.25)continue;
    const nx=clamp(v.pos.x,c.x0,c.x1),nz=clamp(v.pos.z,c.z0,c.z1),dx=v.pos.x-nx,dz=v.pos.z-nz,d=Math.hypot(dx,dz);
    if(d<v.K.R){if(d>1e-4){v.pos.x=nx+dx/d*v.K.R;v.pos.z=nz+dz/d*v.K.R;}else v.pos.x+=v.K.R;v.sp*=.4;}
  }
  const fl=heliFloor(v);
  if(v.pos.y<fl){v.pos.y=fl;if(v.vy<0)v.vy=0;}
  if(v.pos.y>80){v.pos.y=80;if(v.vy>0)v.vy=0;}
  v.aux=lerp(v.aux,grounded?0:-clamp(v.sp/18,-1,1)*.2,Math.min(1,dt*3));
}
function flyB2(v,dt,th,st,up){
  const fl0=heliFloor(v,3),grounded=v.pos.y<=fl0+.06,MAXS=95;
  if(th>0)v.sp+=55*dt;else if(th<0)v.sp-=80*dt;else v.sp-=(grounded?18:2.5)*dt;
  v.sp=clamp(v.sp,0,MAXS);
  v.yaw+=st*dt*(grounded?.7:1.15)*clamp(v.sp/28,0,1);
  let tvy=up*26;
  if(grounded&&v.sp<30)tvy=Math.min(0,tvy);
  v.vy+=(tvy-v.vy)*Math.min(1,dt*2.5);
  if(!grounded&&v.sp<30)v.vy-=(1-v.sp/30)*20*dt;
  const n=Math.max(1,Math.ceil(v.sp*dt/1.4)),h=dt/n;let hit=false;
  for(let i=0;i<n;i++){
    v.pos.x+=-Math.sin(v.yaw)*v.sp*h;v.pos.z+=-Math.cos(v.yaw)*v.sp*h;v.pos.y+=v.vy*h;
    for(const c of G.colliders){
      if(v.pos.y+1.2<=c.y0||v.pos.y>=c.y1-.2)continue;
      const nx=clamp(v.pos.x,c.x0,c.x1),nz=clamp(v.pos.z,c.z0,c.z1),dx=v.pos.x-nx,dz=v.pos.z-nz,d=Math.hypot(dx,dz);
      if(d<v.K.R){if(d>1e-4){v.pos.x=nx+dx/d*v.K.R;v.pos.z=nz+dz/d*v.K.R;}else v.pos.x+=v.K.R;hit=true;}
    }
    const fl=heliFloor(v,3);
    if(v.pos.y<fl){v.pos.y=fl;if(v.vy<0)v.vy=0;}
  }
  if(hit)v.sp*=.6;
  if(v.pos.y>120){v.pos.y=120;if(v.vy>0)v.vy=0;}
  v.aux=lerp(v.aux,(v.pos.y<=heliFloor(v,3)+.06&&v.sp<30)?0:clamp(v.vy/40,-.4,.4),Math.min(1,dt*4));
}
function dropBomb(v){
  if(G.time<me.bombT)return;
  if(v.pos.y<4){showHint('Fly higher to drop bombs',1.5);return;}
  me.bombT=G.time+10;
  fireEvent({t:'bomb',x:r2(v.pos.x),y:r2(v.pos.y-.4),z:r2(v.pos.z),vx:r2(-Math.sin(v.yaw)*v.sp*.06),vy:r2(Math.min(0,v.vy)-2),vz:r2(-Math.cos(v.yaw)*v.sp*.06)});
}
function updateBombs(dt){
  const a=G.bombs;if(!a||!a.length)return;
  for(let i=a.length-1;i>=0;i--){
    const b=a[i];let hit=false;
    const sp=b.vel.length()*dt,n=Math.max(1,Math.ceil(sp/.6)),h=dt/n;
    for(let k=0;k<n&&!hit;k++){
      b.vel.y-=26*h;const dg=Math.exp(-4*h);b.vel.x*=dg;b.vel.z*=dg; /* sideways drift dies out: straight drop */
      b.pos.addScaledVector(b.vel,h);
      if(b.pos.y<=.1)hit=true;
      else for(const c of G.colliders){if(b.pos.x>c.x0&&b.pos.x<c.x1&&b.pos.y>c.y0&&b.pos.y<c.y1&&b.pos.z>c.z0&&b.pos.z<c.z1){hit=true;break;}}
    }
    if(hit){
      G.scene.remove(b.mesh);a.splice(i,1);
      if(b.own)fireEvent({t:'boom',x:r2(b.pos.x),y:r2(Math.max(.4,b.pos.y)),z:r2(b.pos.z),r:32,dmg:260});
      continue;
    }
    b.mesh.position.copy(b.pos);
    _v2.copy(b.pos).add(b.vel);b.mesh.lookAt(_v2);
  }
}
/* ================= gyro missile launcher: lock onto a plane or helicopter, the missile chases it until it hits ================= */
const GY={CD:25,LOCK:.72,CONE:.2,RANGE:600,DMG:.75,SPEED:78,TURN:2.8};
function gyroScan(){
  const A=aim();let best=null,ba=GY.CONE;
  for(const v of vehs.values()){

function pickHide(n){

function punch(){

  else burst(new V3(px,py,pz),[0xcfcfcf],2,2);

function updateUse(dt){
  if(!(me.useT>0))return;
  if(!me.alive||me.car||me.veh||curItem()!==me.useIt){me.useT=0;return;}
  me.useT-=dt;
  const A=aim(),it=me.useIt,ph=3-Math.max(0,me.useT);
  if(it.use==='smoke'){
    me.puffT-=dt;

      puff(new V3(A.ox+A.dx*.5,A.oy+A.dy*.5-.12,A.oz+A.dz*.5),ph>2.4?0xe8e8e8:0xbdbdbd,ph>2.4?2.6:1.5,1.4);
    }
  }
  if(me.useT<=0){
    me.useT=0;
    if(it.use==='drink'){me.hp=Math.min(100,me.hp+(it.heal||0));sfx('eat');toast('Ahh. Cold one.');}
    else{
      for(let i=0;i<5;i++)puff(new V3(A.ox+A.dx*.6,A.oy+A.dy*.6-.1,A.oz+A.dz*.6),0xf0f0f0,3,1.8);
      toast('That hit the spot.');
    }
  }
}
function updateWeapon(dt){
  if(EDIT()){me.cool=0;return;}
  updateUse(dt);
  me.cool-=dt;
  me.kick=Math.max(0,me.kick-dt*7);
  G.rayIgnore=me.veh?me.veh.id:-1;
  const act=G.locked&&!G.pane&&me.alive&&!me.car&&(!me.veh||isGunner())&&!droneFlying();
  const it=curItem();
  if(me.veh&&me.veh.kind==='tank'&&me.seat===0&&G.locked&&!G.pane&&me.alive&&mouse.l&&me.cool<=0)fireTank(me.veh);
  if(me.veh&&me.veh.kind==='b2'&&me.seat===0&&G.locked&&!G.pane&&me.alive&&mouse.l)dropBomb(me.veh);
  if(me.veh&&me.veh.kind==='heli'&&me.seat===0&&G.locked&&!G.pane&&me.alive){
    const hg=ITEMS[itemIdx('heligun')];
    me.heat=me.heat||0;
    if(me.hot&&me.heat<.35)me.hot=false;
    if(mouse.l&&!me.hot&&me.cool<=0){fireGun(hg);me.heat+=.07;if(me.heat>=1){me.hot=true;toast('TURRET OVERHEATED');}}
    else me.heat=Math.max(0,me.heat-dt*(mouse.l&&!me.hot?.1:.4));
  }else{me.heat=Math.max(0,(me.heat||0)-dt*.5);me.hot=false;}
  if(act&&it&&it.id==='minigun'&&mouse.l)me.spin=Math.min(1,me.spin+dt*1.7);else me.spin=Math.max(0,me.spin-dt*2.2);
  me.aiming=!!(act&&it&&it.k==='gun'&&mouse.r);
  if(act&&it){
    const pressL=mouse.l&&!me.lHeld,pressR=mouse.r&&!me.rHeld;
    if(it.k==='gun'){
      if(it.id==='gyro')updateGyro(dt,pressL);
      else if(it.id==='minigun'){if(mouse.l&&me.spin>.4&&me.cool<=0){fireGun(it);me.cool=lerp(.13,.045,(me.spin-.4)/.6);}}
      else if(mouse.l&&me.cool<=0&&(it.auto||pressL))fireGun(it);
    }
    else if(it.k==='fist'){if(mouse.l&&me.cool<=0)punch();}
    else if(it.k==='food'){if(pressL&&me.cool<=0)eat(it);else if(pressR&&me.cool<=0)throwItem(it);}
    else if(it.remote){if(pressL&&me.cool<=0)placeProp(it);else if(pressR&&me.cool<=0)detonateMine();}
    else{if(pressL&&me.cool<=0)placeProp(it);else if(pressR&&me.cool<=0)throwItem(it);}
  }
  if(!(act&&it&&it.id==='gyro')&&me.lk){me.lk=null;gyroBox(null);}
  me.lHeld=mouse.l;me.rHeld=mouse.r;
  G.rayIgnore=-1;
}
function fireGun(it){
  me.cool=it.rate;me.kick=1;sfx(it.id);const sprM=1-.65*me.ads;
  const A=aim(),cp=Math.cos(me.pitch);
  const right=new V3(Math.cos(me.yaw),0,-Math.sin(me.yaw));
  const mx=A.ox+A.dx*.7+right.x*.25,my=A.oy+A.dy*.7-.2,mz=A.oz+A.dz*.7+right.z*.25;
  const lines=[],dmgBy={},impBy={},vdm={},ndm={};
  for(let i=0;i<it.pel;i++){
    let dx=A.dx+(Math.random()-.5)*2*it.spr*sprM,dy=A.dy+(Math.random()-.5)*2*it.spr*sprM,dz=A.dz+(Math.random()-.5)*2*it.spr*sprM;
    const l=Math.hypot(dx,dy,dz);dx/=l;dy/=l;dz/=l;
    const h=castRay(A.ox,A.oy,A.oz,dx,dy,dz,it.range||160);
    const px=A.ox+dx*h.t,py=A.oy+dy*h.t,pz=A.oz+dz*h.t;
    if(lines.length<4)lines.push([r2(px),r2(py),r2(pz)]);
    if(it.id==='rocket'){
      fireEvent({t:'boom',x:r2(px-dx*.3),y:r2(py-dy*.3),z:r2(pz-dz*.3),r:it.rad,dmg:it.dmg});
    }else if(h.type==='player'){
      dmgBy[h.id]=(dmgBy[h.id]||0)+it.dmg;
      burst(new V3(px,py,pz),[0xe5483b,0x8a1d16],3,3);
    }else if(h.type==='prop'){
      const k=it.dmg*.12;
      const q=impBy[h.id]||(impBy[h.id]=[0,0,0]);q[0]+=dx*k;q[1]+=dy*k+.3;q[2]+=dz*k;
      burst(new V3(px,py,pz),[0xffe58a],2,2);
    }else if(h.type==='veh'){
      vdm[h.id]=(vdm[h.id]||0)+it.dmg;burst(new V3(px,py,pz),[0xffd27a,0x888888],3,3);
    }else if(h.type==='npc'){
      ndm[h.id]=(ndm[h.id]||0)+it.dmg;
      burst(new V3(px,py,pz),[0xe5483b,0x8a1d16],3,3);
    }else if(h.type==='world'){
      burst(new V3(px,py,pz),[0xcfcfcf,0x8a8a8a],2,2.5);
    }
  }
  fireEvent({t:'shot',ox:r2(mx),oy:r2(my),oz:r2(mz),l:lines,g:it.i});
  for(const id in dmgBy){
    sendHit(+id,dmgBy[id],me.id);
    const hm=$('hitmark');hm.style.opacity=1;setTimeout(()=>{hm.style.opacity=0;},110);sfx('hit');
  }
  for(const id in vdm){sendVehHit(+id,vdm[id]);const hm=$('hitmark');hm.style.opacity=1;setTimeout(()=>{hm.style.opacity=0;},110);sfx('hit');}
  for(const id in ndm){sendNpcHit(+id,ndm[id]);const hm=$('hitmark');hm.style.opacity=1;setTimeout(()=>{hm.style.opacity=0;},110);sfx('hit');}
  for(const id in impBy){
    const q=impBy[id];
    if(G.net.role==='host')hostHandle({t:'imp',id:+id,vx:q[0],vy:q[1],vz:q[2]},0);
    else sendHost({t:'imp',id:+id,vx:r2(q[0]),vy:r2(q[1]),vz:r2(q[2])});
  }
}
function eat(it){
  if(it.use){

function updateCamera(dt){
  const rv=(me.veh&&!isGunner())?me.veh:null;
  const eye=_v1.set(me.pos.x,me.pos.y+(rv?(rv.kind==='tank'?2.6:rv.kind==='heli'?2.4:rv.kind==='b2'?3:rv.K.cls==='car'?Math.max(2.5,rv.K.h+.7):2.5):EYE-.55*me.crouch+(me.car?.9:0)),me.pos.z);

  if(dfly){cam.rotation.set(me.dr.pitch,me.dr.yaw,me.dr.roll,'YXZ');cam.position.copy(me.dr.pos);}
  else if(me.view==='fp'&&!me.car&&!rv){cam.position.copy(eye);}
  else{
    const cp=Math.cos(me.pitch);
    const dx=-Math.sin(me.yaw)*cp,dy=Math.sin(me.pitch),dz=-Math.cos(me.yaw)*cp;
    const D=rv?(rv.kind==='tank'?10:rv.kind==='heli'?15:rv.kind==='b2'?26:rv.K.cls==='car'?7.5+Math.max(0,rv.K.hz-2.2)*1.6:7.5):me.car?7.5+(me.car.hl?Math.max(0,me.car.hl-2.2)*1.6:0):3.4,sd=(me.car||rv)?0:.45;cam.position.set(eye.x-dx*D+Math.cos(me.yaw)*sd,Math.max(.3,eye.y-dy*D+.25),eye.z-dz*D-Math.sin(me.yaw)*sd);
  }
  if(G.shake>.001){cam.position.x+=(Math.random()-.5)*G.shake;cam.position.y+=(Math.random()-.5)*G.shake;G.shake*=Math.exp(-6*dt);}
  const it=curItem();
  me.ads=lerp(me.ads,me.aiming?1:0,Math.min(1,dt*11));
  const zoom=me.aiming&&it&&it.id==='sniper'&&me.ads>.6;
  G.fov=lerp(G.fov,dfly?Math.min(110,settings.fov*1.15):me.aiming&&it?settings.fov*(it.zoom||.8):settings.fov,Math.min(1,dt*12));
  if(Math.abs(cam.fov-G.fov)>.05){cam.fov=G.fov;cam.updateProjectionMatrix();}
  if(vm.userData.spin){me.spinAng+=me.spin*dt*50;vm.userData.spin.rotation.z=me.spinAng;}
  vm.visible=me.view==='fp'&&me.alive&&!zoom&&!me.car&&!rv&&!dfly;
  if(vm.visible&&vm.userData.base){
    const b=vm.userData.base,a=vm.userData.ads||b,k=me.ads,hs=Math.hypot(me.vel.x,me.vel.z),bb=Math.min(1,hs/4)*(1-k);
    vm.position.set(lerp(b.x,a.x,k)+Math.sin(me.bob*.9)*.012*bb,lerp(b.y,a.y,k)+Math.abs(Math.sin(me.bob*.9))*.012*bb,lerp(b.z,a.z,k)+me.kick*.09*(1-k*.6));
    vm.rotation.x=me.kick*.12*(1-k*.5);
    if(me.useT>0&&me.useIt){
      const ph=3-me.useT,u=clamp(Math.min(ph,me.useT)*4,0,1),dr=me.useIt.use==='drink';
      if(dr){vm.position.x+=(-.2)*u;vm.position.y+=.24*u;vm.position.z+=.1*u;vm.rotation.x=1.25*u+Math.sin(ph*6)*.03*u;}
      else{vm.position.x+=(-.18)*u;vm.position.y+=.2*u;vm.position.z+=.12*u;vm.rotation.x=.5*u;vm.rotation.y=-.8*u;}
    }else vm.rotation.y=0;
  }
  const tp=me.view==='tp';
  me.mesh.visible=(tp||dfly)&&me.alive&&!me.car&&!rv;me.mesh.scale.y=1-.3*me.crouch;
  me.shadow.visible=me.alive;
  me.mesh.position.copy(me.pos);me.mesh.rotation.y=me.yaw;
  const idx=me.inv[me.slot];
  setHeld(me.mesh,ITEMS[idx]?idx:-1);
  animChar(me.mesh,me.phase,Math.hypot(me.vel.x,me.vel.z),me.pitch,!!ITEMS[idx]);
  me.shadow.position.set(me.pos.x,.03,me.pos.z);
  const s=1/(1+me.pos.y*.25);me.shadow.scale.set(s,s,1);

let propCat='gun';
function renderProps(){

  $('propTabs').innerHTML=tabs.map(c=>'<button class="btn'+(c.k===propCat?' on':'')+'" data-k="'+c.k+'">'+c.n+'</button>').join('')+'<button class="btn" data-k="_clear">CLEAR SLOT</button><button class="btn" data-k="_opts">OPTIONS</button><button class="btn primary" data-k="_go">RESUME</button>';
  $('propTabs').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;

addEventListener('keydown',e=>{
  if(G.mode!=='play')return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'))return;
  const k=e.code;
  if(k==='Escape'){
    if(G.pane==='props'||G.pane==='cprops'||G.pane==='ready'||G.pane==='cmaps'){hidePanes();lock();}
    else if(G.pane==='cedit')crCloseEdit();
    else if(G.pane==='pause')showPane('props');
    else if(G.pane==='settings'||G.pane==='skins')showPane('pause');
    return;
  }
  if(k==='Slash'&&!G.pane&&G.locked&&!G.chat){e.preventDefault();openChat();return;}
  keys[k]=true;
  if(k==='Space'||k==='Tab')e.preventDefault();
  if(EDIT()&&creativeKey(e))return;
  if(k==='KeyB')togglePane('props');
  else if(k==='KeyP'&&!G.pane){me.view=me.view==='fp'?'tp':'fp';showHint(me.view==='fp'?'First person':'Third person',1.5);}
  else if(k==='KeyG'&&!G.pane&&G.locked&&me.alive){const it=curItem();if(it&&me.cool<=0)throwItem(it);}
  else if(k==='KeyQ'&&!G.pane&&G.locked&&me.alive&&!me.car)detonateMine();
  else if(k==='KeyJ'&&!G.pane&&G.locked&&me.alive)droneLaunch();
  else if(k==='KeyE'&&!G.pane&&G.locked&&me.alive&&!droneFlying()){if(me.car)exitCar();else if(me.veh)exitVeh();else if(me.nearVeh&&me.nvd<=me.ncd)enterVeh(me.nearVeh);else if(me.nearCar)enterCar(me.nearCar);}
  else if(/^Digit[1-7]$/.test(k))selectSlot(+k.slice(5)-1);
});

addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.l=mouse.r=false;});

    else nv=v+(TR.flat-v)*Math.min(1,f*(.4+TR.s)*dt*10);

}
function trRing(p){

function trChunkInts(ci){

function trSerialize(){

function trClean(list){

    if(!Array.isArray(e)||!Array.isArray(e[1])||e[1].length!==V*V)continue;
    const ci=e[0]|0;if(ci<0||ci>=TR.NC*TR.NC)continue;

function trApply(list,reset){

    const ci=e[0],x0=(ci%TR.NC)*C,z0=((ci/TR.NC)|0)*C;

/* ---- geometry: a block is a set of boxes (a wall with window openings is several boxes) ---- */
function crSub(P,H,out){
  const E=1e-4;
  for(let k=0;k<3;k++)if(H[k]>=P[3+k]-E||H[3+k]<=P[k]+E){out.push(P);return;}
  const p=P.slice();
  for(let k=0;k<3;k++){
    if(p[k]<H[k]-E){const q=p.slice();q[3+k]=H[k];out.push(q);p[k]=H[k];}
    if(p[3+k]>H[3+k]+E){const q=p.slice();q[k]=H[3+k];out.push(q);p[3+k]=H[3+k];}
  }
}
function crPieces(o){
  const hs=[o.size.x/2,o.size.y/2,o.size.z/2];
  let ps=[[-hs[0],-hs[1],-hs[2],hs[0],hs[1],hs[2]]];
  for(const w of o.wins){
    const wa=WAX[w.a][0],ha=WAX[w.a][1],H=[0,0,0,0,0,0];
    H[w.a]=-1e3;H[3+w.a]=1e3;
    H[wa]=w.cu-w.size.x/2;H[3+wa]=w.cu+w.size.x/2;
    H[ha]=w.cv-w.size.y/2;H[3+ha]=w.cv+w.size.y/2;
    const out=[];for(const p of ps)crSub(p,H,out);ps=out;
  }
  return ps;
}
function crBuildGeo(o){
  const pos=[],nor=[],uv=[],idx=[],hs=[o.size.x/2,o.size.y/2,o.size.z/2];
  for(const P of o.pieces){
    for(let k=0;k<3;k++)for(let s=-1;s<=1;s+=2){
      const i=(k+1)%3,j=(k+2)%3,kv=s>0?P[3+k]:P[k];
      const cs=[[P[i],P[j]],[P[3+i],P[j]],[P[3+i],P[3+j]],[P[i],P[3+j]]];
      if(s<0)cs.reverse();
      const b=pos.length/3;
      for(const c of cs){
        const v=[0,0,0],n=[0,0,0];v[k]=kv;v[i]=c[0];v[j]=c[1];n[k]=s;
        pos.push(v[0],v[1],v[2]);nor.push(n[0],n[1],n[2]);uv.push(c[0]+hs[i],c[1]+hs[j]);
      }
      idx.push(b,b+1,b+2,b,b+2,b+3);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  return g;
}
function crBB(o){
  const m=_cm.makeRotationFromQuaternion(o.quat).elements;
  const h=[o.size.x/2,o.size.y/2,o.size.z/2],p=[o.pos.x,o.pos.y,o.pos.z],e=[0,0,0],lo=[0,0,0],hi=[0,0,0];
  for(let k=0;k<3;k++){
    e[k]=Math.round((Math.abs(m[k])*h[0]+Math.abs(m[4+k])*h[1]+Math.abs(m[8+k])*h[2])*1e5)/1e5;
    lo[k]=Math.round((p[k]-e[k])*1e5)/1e5;hi[k]=Math.round((p[k]+e[k])*1e5)/1e5;
  }
  o.e=e;o.bb={min:lo,max:hi};
}
function crPieceBox(o,P){
  const m=_cm.makeRotationFromQuaternion(o.quat).elements;
  const c=[(P[0]+P[3])/2,(P[1]+P[4])/2,(P[2]+P[5])/2],h=[(P[3]-P[0])/2,(P[4]-P[1])/2,(P[5]-P[2])/2];
  const wc=new V3(c[0],c[1],c[2]).applyQuaternion(o.quat).add(o.pos),w=[wc.x,wc.y,wc.z],r=[];
  for(let k=0;k<3;k++){const e=Math.abs(m[k])*h[0]+Math.abs(m[4+k])*h[1]+Math.abs(m[8+k])*h[2];r.push(Math.round((w[k]-e)*1e5)/1e5,Math.round((w[k]+e)*1e5)/1e5);}
  return{x0:r[0],x1:r[1],y0:r[2],y1:r[3],z0:r[4],z1:r[5]};
}
/* collision: physical boxes only exist while collision is ON, so toggling takes effect at once */
function crSyncCols(o,boxes){
  while(o.cols.length>boxes.length){const c=o.cols.pop(),i=G.colliders.indexOf(c);if(i>=0)G.colliders.splice(i,1);}
  while(o.cols.length<boxes.length){const c={x0:0,x1:0,y0:0,y1:0,z0:0,z1:0};o.cols.push(c);G.colliders.push(c);}
  for(let i=0;i<boxes.length;i++)Object.assign(o.cols[i],boxes[i]);
}

/* ---- windows ---- */
function crWinPose(host,a,cu,cv){
  const wa=WAX[a][0],ha=WAX[a][1],l=new V3();
  l.setComponent(wa,cu);l.setComponent(ha,cv);
  return{pos:l.applyQuaternion(host.quat).add(host.pos),quat:host.quat.clone().multiply(CR.frames[a])};
}
function crWinClamp(w){
  const h=w.host,wa=WAX[w.a][0],ha=WAX[w.a][1],hw=h.size.getComponent(wa)/2,hh=h.size.getComponent(ha)/2;
  w.size.x=clamp(w.size.x,.1,Math.max(.1,hw*2));w.size.y=clamp(w.size.y,.1,Math.max(.1,hh*2));
  w.cu=clamp(w.cu,-hw+w.size.x/2,hw-w.size.x/2);w.cv=clamp(w.cv,-hh+w.size.y/2,hh-w.size.y/2);
}
function crWinSync(w){const p=crWinPose(w.host,w.a,w.cu,w.cv);w.pos.copy(p.pos);w.quat.copy(p.quat);}
function crApplyWin(w){
  w.mesh.position.copy(w.pos);w.mesh.quaternion.copy(w.quat);w.mesh.scale.set(w.size.x,w.size.y,w.size.z);w.mesh.updateMatrix();
  crBB(w);crSyncCols(w,w.collide?[{x0:w.bb.min[0],x1:w.bb.max[0],y0:w.bb.min[1],y1:w.bb.max[1],z0:w.bb.min[2],z1:w.bb.max[2]}]:[]);
}
function crWinSnap(host,a,m,val,size){
  if(!CR.snap)return val;
  const ax=m?WAX[a][1]:WAX[a][0],hs=host.size.getComponent(ax)/2,g=gridSize(),thr=Math.max(.12,Math.min(.4,g*.6));
  const lo=val-size/2+hs,hi=lo+size;
  if(Math.abs(lo)<=thr)return val-lo;
  if(Math.abs(hi-2*hs)<=thr)return val+(2*hs-hi);
  const d1=Math.round(lo/g)*g-lo,d2=Math.round(hi/g)*g-hi;
  return val+(Math.abs(d1)<=Math.abs(d2)?d1:d2);
}
function crWinSetFromWorld(w,np,sn){
  const h=w.host,wa=WAX[w.a][0],ha=WAX[w.a][1];
  const rel=np.clone().sub(h.pos).applyQuaternion(h.quat.clone().invert());
  let cu=rel.getComponent(wa),cv=rel.getComponent(ha);
  if(sn[0])cu=crWinSnap(h,w.a,0,cu,w.size.x);
  if(sn[1])cv=crWinSnap(h,w.a,1,cv,w.size.y);
  w.cu=cu;w.cv=cv;crApply(w);
}
function crWindowCalc(ray){
  const p=crPick(ray,null);if(!p||!p.obj)return null;
  let host=p.obj;if(host.type==='window')host=host.host;if(host.type!=='rect')return null;
  const inv=host.quat.clone().invert(),nl=p.n.clone().applyQuaternion(inv);
  let a=0;for(let k=1;k<3;k++)if(Math.abs(nl.getComponent(k))>Math.abs(nl.getComponent(a)))a=k;
  const wa=WAX[a][0],ha=WAX[a][1],hw=host.size.getComponent(wa)/2,hh=host.size.getComponent(ha)/2;
  if(hw<.15||hh<.15)return null;
  const lp=p.point.clone().sub(host.pos).applyQuaternion(inv);
  const w=Math.min(CR.winDef.w,hw*2),h=Math.min(CR.winDef.h,hh*2);
  let cu=crWinSnap(host,a,0,lp.getComponent(wa),w),cv=crWinSnap(host,a,1,lp.getComponent(ha),h);
  cu=clamp(cu,-hw+w/2,hw-w/2);cv=clamp(cv,-hh+h/2,hh-h/2);
  const pose=crWinPose(host,a,cu,cv);
  return{host,a,cu,cv,w,h,pos:pose.pos,quat:pose.quat,size:new V3(w,h,.1)};
}

/* ---- object model ---- */
function crTextDraw(o){
  const H=128,W=clamp(Math.round(H*o.size.x/o.size.y),32,2048);
  if(o.cv.width!==W||o.cv.height!==H){o.cv.width=W;o.cv.height=H;}
  const c=o.cv.getContext('2d'),s=o.txt.str||' ';
  c.clearRect(0,0,W,H);c.save();c.translate(W/2,H/2);
  c.font='bold '+Math.round(H*.8)+'px Arial,Helvetica,sans-serif';c.textAlign='center';c.textBaseline='middle';
  const mw=Math.max(1,c.measureText(s).width);c.scale((W*.96)/mw,1);
  c.lineJoin='round';c.lineWidth=H*.07;c.strokeStyle='rgba(0,0,0,.55)';c.strokeText(s,0,0);
  c.fillStyle=o.txt.color;c.fillText(s,0,0);c.restore();
  o.tex.needsUpdate=true;
}
function crTextMesh(o){

/* ---- prop models: one shared vertex-coloured geometry per kind (unit cube, scaled by the object's size) ---- */
function crPropModel(kind){

    let mx=0;for(const o of CR.objs)if(o.id>mx)mx=o.id;CR.seq=Math.max(CR.seq,mx);
